# difftest actor-look (the Undead FX build; the reanimate-fx memo's D6 B and
# D3 B; wire-rules natives' actor look rows): an actor's look rows are its
# simulator's alone, and T2's settings (the deployed stage's,
# lab/tools/test-proto.sh) carry no npcEnabled, so neither stack holds a
# game-file NPC and none is simulated: this session proves the refusals send
# nothing (the relayed path is T0's, wire-rules natives'
# an_actors_look_is_its_simulators_relayed_on_its_selfs_sequence and
# wire-bridge's the_bridge_relays_an_actors_look_on_its_selfs_sequence, then
# T3's). c1 and c2 are new characters (profiles 9 and 10, actors 0xff000002
# and 0xff000003, see melee-reach), both at the spawn in Tamriel's exterior
# cell (32, -15), form 0xbbb1 (cell-host's read); c2 starts 1.5 s after c1,
# and each client's times below are its own. At 1 s c1 reports the cell
# loaded and is granted it, HostGrant {cell 0xbbb1, epoch 1}, as in
# cell-host. Its game then reports five look calls (ScriptCall 75), each
# refused by its name (the wire server's log says the first of each code a
# minute, the rest counted), nothing sent: at 3 s EffectShader.Play(0x86111,
# 4.0) on ShockDisintegrate01FXS 0xd22fb (Skyrim.esm, TurnToAsh's shader),
# its subject standing's ACHR 0x86111, of which the server holds no reference
# (E_SCRIPTCALL_OWNER); at 3.2 s the same Play on the ore vein 0x10e6c5,
# script-call's world object (E_SCRIPTCALL_ROW: the row is an actor's look);
# at 3.4 s Actor.SetAlpha(0.0, true) on its own player 0x14
# (E_SCRIPTCALL_ROW: a player's own looks stay on its seat); at 3.6 s
# EffectShader.Play on 0x86111 with its own player as the method's self
# (E_SCRIPTCALL_ARGS: no method self the reporter may name); at 3.8 s
# VisualEffect.Play(0x86111, -1.0) on DA10ReanimateTargetFX 0x107d9b with two
# arguments of the row's three (E_SCRIPTCALL_ARGS); and at 2.4 s of its own
# script c2 reports Actor.AttachAshPile(None) on 0x86111
# (E_SCRIPTCALL_OWNER). The legacy server knows no MsgType 75 and drops all
# six. c2 never reports the cell loaded, so c1's departure leaves it unhosted
# after the grace with nothing to c2; c2 steps aside at 6 s so it outlives
# c1, as in every session.
id: actor-look
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 1000, send: {t: 47, cell: 0xbbb1, loaded: true}, reliable: true}
  - {client: c1, at_ms: 3000, send: {t: 75, epoch: 0, selfId: 0xd22fb, cls: EffectShader, fn: Play, args: [{formId: 0x86111, type: Actor}, 4.0], caller: ReanimateAshPile, handler: TurnToAsh, latent: false}, reliable: true}
  - {client: c1, at_ms: 3200, send: {t: 75, epoch: 0, selfId: 0xd22fb, cls: EffectShader, fn: Play, args: [{formId: 0x10e6c5, type: ObjectReference}, 4.0], caller: ReanimateAshPile, handler: TurnToAsh, latent: false}, reliable: true}
  - {client: c1, at_ms: 3400, send: {t: 75, epoch: 0, selfId: 0x14, cls: Actor, fn: SetAlpha, args: [0.0, true], caller: ReanimateAshPile, handler: TurnToAsh, latent: false}, reliable: true}
  - {client: c1, at_ms: 3600, send: {t: 75, epoch: 0, selfId: 0x14, cls: EffectShader, fn: Play, args: [{formId: 0x86111, type: Actor}, 4.0], caller: ReanimateAshPile, handler: TurnToAsh, latent: false}, reliable: true}
  - {client: c1, at_ms: 3800, send: {t: 75, epoch: 0, selfId: 0x107d9b, cls: VisualEffect, fn: Play, args: [{formId: 0x86111, type: Actor}, -1.0], caller: "", handler: "", latent: false}, reliable: true}
  - {client: c2, at_ms: 2400, send: {t: 75, epoch: 0, selfId: 0x86111, cls: Actor, fn: AttachAshPile, args: [{formId: 0, type: Form}], caller: ReanimateAshPile, handler: TurnToAsh, latent: false}, reliable: true}
  - {client: c2, at_ms: 6000, move: {dx: 1, dy: 0}}
divergences:
  - client: c1
    msg: {t: 48, cell: 0xbbb1, epoch: 1}
    legacy: 0
    wire: 1
    reason: the first loader in reach hosts the cell (HostGrant, thuum docs/verbs/cell-host.md); the legacy server has no cell hosts
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
