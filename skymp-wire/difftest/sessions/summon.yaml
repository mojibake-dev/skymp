# difftest summon (thuum tracker #84, docs/verbs/summon.md, ADR-052 decision 3 as amended 2026-11-16,
# ADR-063: the caster's row owns its summon): a player's game reports the summon its engine placed at a
# summon effect's apply (Summon, MsgType 83: the local id, the base, the effect and the spell, the place,
# the time left) and the server places its own actor, binding the caster's view to the engine's own
# summon (the create word's ownLocal) while every other game draws a puppet. The forms are the baseline's
# (x-summon-baseline 20261116-083744, lab/esm.py on sky-srv, 2026-11-16):
# ConjureFlameAtronachRightHand 1052278 (0x100e76) carries two perk-gated summon effects; 321861
# (0x4e945, SummonAtronachFlamePotent's effect) summons NPC_ 321856 (0x4e940), so the report names that
# pair. c1 and c2 are new characters (profiles 9 and 10, ghostwalk's), both standing at the spawn
# (133857, -61130, 14662 in Tamriel 60, server-settings-t2.json's startPoints), and the reports place
# each summon 300 units east of it, inside both games' grid squares: a summon at the world's origin
# (the first draft's (300, 0, 0)) stands 137,000 units from both seats, where no grid square of either
# covers it and only the caster stays a listener (the actor's simulator is kept one at any distance,
# MpObjectReference::ForceSubscriptionsUpdate, npc-handoff D6), so the watcher saw nothing at all. The
# second report is a scroll's cast (SCRL 0xa44a1 ConjureStormAtronachScroll by the same read, its spell
# and effect the report's own words, recorded unvalidated, R2: the spell is never learned and the wire
# never asks), then the first summon's end, every field on it (zeros elsewhere, the real client's own
# end report, summonService.ts: a message without its fields is refused by the recognizer before the
# server ever reads it, E_JSON_SHAPE, the first draft's missing baseId). The legacy server knows no
# MsgType 83 and drops all three reports. The placed actors take 0xff000004 and 0xff000005 (the run's
# fates name them, 4278190084 and 4278190085), and the delete words name them by idx. The kill's isDead
# property reaches c1 three times: its own copy plus the redirected copies of the spawn square's offline
# NPC listeners, which GetActorToSendTo hands to the cell's host (c1, the spawn cell's grant at its
# login through reach_ranked) - the quirk UpdateHoster's own comment documents ("CellHostTest's stray
# 'true', pipelines 2594 and 2602"), the engine's pre-existing delivery, not the verb's; the client's
# ActorFateService costs a repeat nothing. c1's copy of the second summon's kill never comes (the
# departure's disconnecting guard), and the second's fade's delete reaches c2 after c1 is gone.
id: summon
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 1500, send: {t: 12, data: {t: 12, commandName: addspell, args: [20, 1052278]}}}
  - {client: c1, at_ms: 2000, send: {t: 83, localId: 4278192381, baseId: 321856, effectId: 321861, spellId: 1052278, pos: [134157.0, -61130.0, 14662.0], rot: [0.0, 0.0, 90.0], worldOrCell: 60, remainingS: 59.5, ended: false}, reliable: true}
  - {client: c1, at_ms: 2500, send: {t: 83, localId: 4278192382, baseId: 132288, effectId: 0, spellId: 672929, pos: [134157.0, -61130.0, 14662.0], rot: [0.0, 0.0, 90.0], worldOrCell: 60, remainingS: 59.5, ended: false}, reliable: true}
  - {client: c1, at_ms: 4000, send: {t: 83, localId: 4278192381, baseId: 0, effectId: 0, spellId: 0, pos: [0.0, 0.0, 0.0], rot: [0.0, 0.0, 0.0], worldOrCell: 0, remainingS: 0, ended: true}, reliable: true}
  - {client: c2, at_ms: 0, move: {dy: 30}}
  - {client: c2, at_ms: 8000, move: {dy: 60}}
divergences:
  - client: c1
    msg: {t: 41, text: "addspell done: 100e76 recorded", refused: false}
    legacy: 0
    wire: 1
    reason: an owner's AddSpell writes the server's record of learned spells and answers with a line (ghostwalk's); the legacy server does not know the command
  - client: c1
    msg: {t: 30, class: Actor, function: AddSpell, arguments: [{formId: 1052278, type: Spell}, false]}
    legacy: 0
    wire: 1
    reason: the console's addspell is told to c1's own game (the owner's AddSpell snippet, ghostwalk's); the legacy server does not know the command
  - client: c1
    msg: {t: 51, fates: [{refrId: 4278190084}]}
    legacy: 0
    wire: 1
    reason: the learned spell's summon's fate ahead of its create word (ActorFate 51, the roll PlaceAt makes for a server-made NPC, thuum ADR-050 decision 3); the legacy server places nothing
  - client: c1
    msg: {t: 51, fates: [{refrId: 4278190085}]}
    legacy: 0
    wire: 1
    reason: the scroll's summon's fate ahead of its create word, as the learned spell's
  - client: c1
    msg: {t: 33, baseId: 321856, baseRecordType: NPC_, props: {ownLocal: 4278192381, isHostedByOther: false}}
    legacy: 0
    wire: 1
    reason: the learned spell's create word binds its caster to the engine reference its game holds (tracker #84); the legacy server knows no MsgType 83 and drops the report
  - client: c1
    msg: {t: 33, baseId: 132288, baseRecordType: NPC_, props: {ownLocal: 4278192382, isHostedByOther: false}}
    legacy: 0
    wire: 1
    reason: the scroll's summon records like the learned spell's, its spell and effect the report's own words (R2 recorded unvalidated), its word binding its caster alike
  - client: c1
    msg: {t: 18}
    legacy: 0
    wire: 1
    reason: the end's dispel kills the summon and its death state container reaches the host alone (GetActorToSendTo), the caster whose game simulates it
  - client: c1
    msg: {t: 7, refrId: 4278190084, propName: isDead}
    legacy: 0
    wire: 3
    reason: "the kill's isDead property to the listeners (ADR-048's seam): c1's own copy plus the redirected copies of the spawn square's offline NPC listeners, which GetActorToSendTo hands to the cell's host (the quirk UpdateHoster's comment documents, CellHostTest's stray lines); the engine's pre-existing delivery, a repeat costing the client nothing"
  - client: c1
    msg: {t: 25, idx: "refr:ff000004"}
    legacy: 0
    wire: 1
    reason: the fade's end (the GMST's 1.5 s, read from the records) deletes the server's actor, the DestroyActor to every listener; the caster's client holds its engine reference, the engine's own Finish deleting it
  - client: c2
    msg: {t: 51, fates: [{refrId: 4278190084}]}
    legacy: 0
    wire: 1
    reason: the learned spell's summon's fate ahead of its create word to its listener, as to c1
  - client: c2
    msg: {t: 51, fates: [{refrId: 4278190085}]}
    legacy: 0
    wire: 1
    reason: the scroll's summon's fate to its listener, as to c1
  - client: c2
    msg: {t: 33, baseId: 321856, props: {isHostedByOther: true}}
    legacy: 0
    wire: 1
    reason: the watcher's word carries no bind and no record type (a server-made actor's word names none, the client's copy path keying on the base), its copy a puppet the caster's game simulates
  - client: c2
    msg: {t: 33, baseId: 132288, props: {isHostedByOther: true}}
    legacy: 0
    wire: 1
    reason: the scroll's puppet word to the watcher, no bind on it, as the learned spell's
  - client: c2
    msg: {t: 7, refrId: 4278190084, propName: isDead}
    legacy: 0
    wire: 1
    reason: the first summon's kill isDead property to the watcher's own game (its own copy, the listener set's one online watcher)
  - client: c2
    msg: {t: 7, refrId: 4278190085, propName: isDead}
    legacy: 0
    wire: 1
    reason: the second summon's kill at the caster's departure, the same property to its listener (the leaver's own copy skipped by the disconnecting guard)
  - client: c2
    msg: {t: 30, class: Actor, function: SetAlpha, arguments: [0.0, true], selfId: 4278190084}
    legacy: 0
    wire: 1
    reason: the first summon's dispel fade served to the watcher's game alone, the caster's engine having run its own end (fSummonedCreatureFadeOutSeconds' look)
  - client: c2
    msg: {t: 30, class: Actor, function: SetAlpha, arguments: [0.0, true], selfId: 4278190085}
    legacy: 0
    wire: 1
    reason: the scroll summon's dispel fade at the departure, the same look to the watcher
  - client: c2
    msg: {t: 25, idx: "refr:ff000004"}
    legacy: 0
    wire: 1
    reason: the same delete on the watcher's game, its copy gone with the record
  - client: c2
    msg: {t: 25, idx: "refr:ff000005"}
    legacy: 0
    wire: 1
    reason: the scroll summon's delete on the watcher's game after the departure's dispel ran its fade
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
