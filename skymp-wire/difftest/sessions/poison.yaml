# difftest poison (M2, thuum docs/verbs/poison.md): c1 and c2 are new
# characters (profiles 9 and 10, actors 0xff000002 and 0xff000003: see
# melee-reach), c2 50 units east of the spawn, which the spawn faces (see
# god-mode). The lab server runs with enableConsoleCommandsForAll (see
# console), so at 2 s c1 gives itself Skyrim.esm's DB03Poison (ALCH 0x58CFB,
# 363771: flagged a poison, 6 a second for 10 s; thuum lab/esm.py). At 2.3 s
# c1 holds its Iron Dagger (WEAP 0x1397E, 80254, a new character's) in the
# right hand (UpdateEquipment). At 3 s c1 reports the poison's OnEquip, as
# its game reports the box's Yes (the PoisonedWeapon event): the fixed server
# spends the poison and marks the dagger with one dose; the legacy server
# drinks it. At 3.5 s c1 hits c2 with the dagger: both servers take the
# dagger's damage from c2; the fixed server also runs the poison's effects
# on c2 and spends the dose. c2 steps again at 3.5 s of its own (5 s of
# c1's), so it outlives c1, as in every session.
id: poison
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 2000, send: {t: 12, data: {t: 12, commandName: additem, args: [20, 363771, 1]}}}
  - {client: c1, at_ms: 2300, send: {t: 5, idx: "{{idx}}", data: {inv: {entries: [{baseId: 80254, count: 1, worn: true}]}, numChanges: 1}}}
  - {client: c1, at_ms: 3000, send: {t: 11, baseId: 363771}}
  - {client: c1, at_ms: 3500, send: {t: 17, data: {aggressor: 20, target: 4278190083, source: 80254, isBashAttack: false, isHitBlocked: false, isPowerAttack: false, isSneakAttack: false, projectile: 0}}}
  - {client: c2, at_ms: 0, move: {dx: 50}}
  - {client: c2, at_ms: 3500, move: {dx: 60}}
divergences:
  - client: c1
    msg: {t: 41, text: "additem done", refused: false}
    legacy: 0
    wire: 1
    reason: the server answers every console command with a line (ConsoleOutput, thuum docs/verbs/console-commands.md); the legacy server prints nothing back
  - client: c2
    msg: {t: 25, idx: 2}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
