# difftest claim-outlives-grant (thuum ADR-073 decision 6 with D-L2 B, step 5a; ADR-052's 2026-10-28 amendment
# option B; docs/verbs/npc-talk.md): a talk claim outlives a grant of its cell, first to the claimant itself, then to
# another player, and its release still finds it (wire-rules cells grant(): `retain(|_, f| f.cell != cell || f.kind ==
# FollowKind::Claim)`; T0 a_talk_gives_one_actor_..._and_outlives_a_grant and a_grant_to_another_player_keeps_a_
# dialogue_claim_until_its_lease). c1 and c2 are new characters (profiles 9 and 10, actors 0xff000002 and 0xff000003,
# see melee-reach); c2 starts 1.5 s after c1, each client's times its own. The place is Skyrim.esm's RiverwoodTrader
# 0x133c9, an interior (records read on sky-srv for step 5a's design, 2026-11-14): Lucan Valerius 0x13487 and Camilla
# 0x13488 stand in it. A fake client reaches it through `moveto` (an owner's console command; T2's settings give every
# caller owner rank on the wire stack, see console), the server's own teleport onto Lucan's record (Teleport 20 to the
# caller, "moveto done" on its console), which puts the claimant within activation reach in the actor's cell. The
# claim names Lucan by the server's index, "{{idx:0x13487}}", which the wire fakeclient fills from the create word that
# paired the index with the form (fork wire-fakeclient; the C++ fakeclient sends the string, and the legacy server
# knows neither MsgType 56 nor `moveto`, so on the legacy stack both clients stay at the spawn and nothing below happens).
#
# Leg 1, the grant to the claimant. At 0.2 s c1 goes to Lucan; at 1 s it reports the trader loaded: the first loader
# in reach hosts it (HostGrant {cell 0x133c9, epoch 1}). c2 goes to Lucan at 0.5 s of its own, reports the trader
# loaded at 1.5 s (hosted: nothing) and at 2.5 s claims Lucan for a dialogue: granted, so the word names c2 (Lucan's
# keyframe to c2, isHostedByOther false to c2 and true to c1). At 5.5 s c1 reports the trader unloaded: its grace
# arms, and at its end (5 s, at the next once-a-second tick) the cell passes to c2, the only visitor with it loaded
# and in reach (HostRelease {epoch 1} to c1, HostGrant {epoch 2} to c2). The claim stands. Both flips of the swap
# word Lucan and Camilla, the release's running after the grant has named c2 (PartOne FlipHostedFlags), so c2 hears
# two keyframes and two "false" for each and c1 two "true". At 12.5 s c1 loads the trader again (hosted by c2:
# nothing) and at 13 s claims Lucan: Held (E_CLAIM_HELD in the wire server's log), so no word and no keyframe reach
# c1; a grant that had dropped the claim would have given c1 Lucan here.
#
# Leg 2, the grant to another player. The claimant c2 now hosts the trader; at 12 s of its own it goes to Sven
# 0x13491 in Riverwood's exterior (moveto again, Teleport 20), which takes the trader off the server's grid for c2
# while its game still reports it loaded: c2 hosts the cell out of reach and keeps its dialogue claim (only its own
# unload would end that, ADR-052 decision 2, and c2 never reports one; the third-player T0 case keeps its claimant
# in the cell for the same reason). Its grace arms at the next tick and at its end the cell passes to c1, loaded and
# in reach (HostRelease {epoch 2} to c2, HostGrant {epoch 3} to c1); the claim passes over the grant, so the flip
# names c2 for Lucan (isHostedByOther true to c1, no keyframe: c2's game no longer sees him). Leaving the trader also
# takes each player out of the other's view (DestroyActor 25 both ways). At 21.5 s of its own c2 releases Lucan: the
# release finds the claim and the cell's rule names c1 (his keyframe to c1, isHostedByOther false to c1). The
# lease (CLAIM_LEASE_MS, 120 s) outlasts every session and is T0's. c1 reports the trader loaded again at 24.5 s (a
# repeat: nothing) and c2 at 27 s of its own, so each stays connected through the other's last word and c2 outlives c1.
#
# UpdateMovement compares exactly here (not as presence): the server sends a keyframe (PartOne::SendActorKeyframe, the
# one UpdateMovement the core builds, a t:2) to the simulator ahead of each word, neither client moves, and a
# keyframe in relays_seen could not be declared. The keyframes and the words (UpdateProperty 7 isHostedByOther,
# MpObjectReference::UpdateHoster at a grant's or a release's flip, a claim, a release and a ClaimEnded) are declared
# below by count, read from PartOne.cpp; each reason names the events it counts and what a grant that dropped the
# claim, or a claim that took Lucan from its holder, would read instead.
#
# What the first run decides (premises the code alone does not fix): both players listen to Lucan and Camilla whenever
# they stand in the trader, and c2 to neither once it stands by Sven (the counts below rest on both); and the legacy
# C++ fakeclient sends "{{idx:0x13487}}" through unchanged, as it sends prop-physics' "{{created:}}" (no "{{idx"
# string has been tried there). A talk reads no quest record, so the run record's quests do not enter here.
#
# Not declared yet: the first T2 of this session (ONLY=claim-outlives-grant) draws what the code alone does not fix:
# the forms of the spawn leaving each client's view at its moveto (DestroyActor 25, the lock chest 0xf321a among
# them); the trader's references entering it (CreateActor 33, Lucan and Camilla among them) and, for c2, Riverwood's;
# the trader's references leaving c2's view at its moveto onto Sven (DestroyActor 25, Lucan and Camilla among them);
# each player's create word for the other, at the spawn on the legacy stack and in the trader on the wire; the words
# and keyframes of any actor of the trader besides Lucan and Camilla; and any fate (ActorFate 51), record
# (ChangeFormApply 74) or script state (ScriptStateApply 77, ahead of a grant) the trader's load and grants serve, and
# Riverwood's fates for c2 at its moveto onto Sven (SendFates in RefreshReach). Each is read against the paragraphs
# above before it is declared.
id: claim-outlives-grant
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
volatile: [3, 24]
steps:
  - {client: c1, at_ms: 200, send: {t: 12, data: {t: 12, commandName: moveto, args: [20, 0x13487]}}, reliable: true}
  - {client: c1, at_ms: 1000, send: {t: 47, cell: 0x133c9, loaded: true}, reliable: true}
  - {client: c2, at_ms: 500, send: {t: 12, data: {t: 12, commandName: moveto, args: [20, 0x13487]}}, reliable: true}
  - {client: c2, at_ms: 1500, send: {t: 47, cell: 0x133c9, loaded: true}, reliable: true}
  - {client: c2, at_ms: 2500, send: {t: 56, idx: "{{idx:0x13487}}", claim: true}, reliable: true}
  - {client: c1, at_ms: 5500, send: {t: 47, cell: 0x133c9, loaded: false}, reliable: true}
  - {client: c1, at_ms: 12500, send: {t: 47, cell: 0x133c9, loaded: true}, reliable: true}
  - {client: c1, at_ms: 13000, send: {t: 56, idx: "{{idx:0x13487}}", claim: true}, reliable: true}
  - {client: c2, at_ms: 12000, send: {t: 12, data: {t: 12, commandName: moveto, args: [20, 0x13491]}}, reliable: true}
  - {client: c2, at_ms: 21500, send: {t: 56, idx: "{{idx:0x13487}}", claim: false}, reliable: true}
  - {client: c1, at_ms: 24500, send: {t: 47, cell: 0x133c9, loaded: true}, reliable: true}
  - {client: c2, at_ms: 27000, send: {t: 47, cell: 0x133c9, loaded: true}, reliable: true}
divergences:
  - client: c1
    msg: {t: 41, text: "moveto done", refused: false}
    legacy: 0
    wire: 1
    reason: an owner's moveto runs the server's teleport and answers with a line (thuum docs/verbs/console-commands.md); the legacy server does not know the command
  - client: c1
    msg: {t: 20, idx: "refr:ff000002", worldOrCell: 0x133c9}
    legacy: 0
    wire: 1
    reason: the moveto's teleport onto Lucan's record in RiverwoodTrader 0x133c9 (MpActor::Teleport); the legacy server stays silent
  - client: c1
    msg: {t: 48, cell: 0x133c9, epoch: 1}
    legacy: 0
    wire: 1
    reason: the first loader in reach hosts the trader (HostGrant, thuum docs/verbs/cell-host.md); the legacy server has no cell hosts
  - client: c1
    msg: {t: 49, cell: 0x133c9, epoch: 1}
    legacy: 0
    wire: 1
    reason: c1's unload ran out its grace and the trader passed to c2, the claimant (HostRelease of epoch 1)
  - client: c2
    msg: {t: 48, cell: 0x133c9, epoch: 2}
    legacy: 0
    wire: 1
    reason: the grant to the claimant itself, at the next epoch; its dialogue claim on Lucan passes over the grant (ADR-073 decision 6, D-L2 B)
  - client: c2
    msg: {t: 49, cell: 0x133c9, epoch: 2}
    legacy: 0
    wire: 1
    reason: c2 left the trader's grid (moveto Sven) and its grace passed the cell to c1 (HostRelease of epoch 2)
  - client: c1
    msg: {t: 48, cell: 0x133c9, epoch: 3}
    legacy: 0
    wire: 1
    reason: the grant to another player than the claimant, at the next epoch; c2's dialogue claim passes over it too, until c2's release
  - client: c2
    msg: {t: 41, text: "moveto done", refused: false}
    legacy: 0
    wire: 2
    reason: c2's two movetos (onto Lucan, then onto Sven), each answered with a line; the legacy server does not know the command
  - client: c2
    msg: {t: 20, idx: "refr:ff000003", worldOrCell: 0x133c9}
    legacy: 0
    wire: 1
    reason: c2's first teleport, onto Lucan's record in the trader
  - client: c2
    msg: {t: 20, idx: "refr:ff000003"}
    legacy: 0
    wire: 1
    reason: c2's second teleport, onto Sven 0x13491 in Riverwood's exterior; the trader's was set aside by the declaration above
  - client: c1
    msg: {t: 25, idx: "refr:ff000003"}
    legacy: 0
    wire: 1
    reason: c2 left the trader, and with it c1's view (its moveto onto Sven); on the legacy stack both stay at the spawn and c2 outlives c1
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: c1 left c2's view when c2 left the trader; c1's departure later reaches nobody who sees it (the legacy stack's RakNet timeout outlasts c2)
  - client: c1
    msg: {t: 2, idx: "refr:13487"}
    legacy: 0
    wire: 2
    reason: Lucan's record ahead of each word naming c1 for him, epoch 1's grant and c2's release (epoch 3's grant names c2, whose game no longer sees him, so no keyframe goes); a grant that dropped the claim, or a claim of c1's that took him, reads 3 (c1's claim granted)
  - client: c1
    msg: {t: 7, refrId: 0x13487, propName: isHostedByOther, dataDump: "false"}
    legacy: 0
    wire: 2
    reason: c1 named for Lucan at epoch 1's grant and at c2's release; a dropped or a taken claim reads 3
  - client: c1
    msg: {t: 7, refrId: 0x13487, propName: isHostedByOther, dataDump: "true"}
    legacy: 0
    wire: 4
    reason: c2 named for Lucan at its claim, epoch 1's release, epoch 2's grant and epoch 3's grant passing over the claim; a dropped or a taken claim reads 3
  - client: c1
    msg: {t: 2, idx: "refr:13488"}
    legacy: 0
    wire: 2
    reason: Camilla, with no row, follows the cell's host; her record ahead of each word naming c1, at epoch 1's grant and epoch 3's
  - client: c1
    msg: {t: 7, refrId: 0x13488, propName: isHostedByOther, dataDump: "false"}
    legacy: 0
    wire: 2
    reason: c1 named for Camilla at epoch 1's grant and epoch 3's
  - client: c1
    msg: {t: 7, refrId: 0x13488, propName: isHostedByOther, dataDump: "true"}
    legacy: 0
    wire: 2
    reason: c2 named for Camilla by both flips of the swap to epoch 2 (the release's flip runs after the grant has named c2)
  - client: c2
    msg: {t: 2, idx: "refr:13487"}
    legacy: 0
    wire: 3
    reason: Lucan's record ahead of each word naming c2 for him, its claim and both flips of the swap to epoch 2; FlipHostedFlags keys the claim's holder though its game runs him (ClaimActor and ClaimEnded skip that case), and with that skip this reads 1
  - client: c2
    msg: {t: 7, refrId: 0x13487, propName: isHostedByOther, dataDump: "false"}
    legacy: 0
    wire: 3
    reason: c2 named for Lucan at its claim and by both flips of the swap to epoch 2, which pass over the claim; c2 left the trader before epoch 3's grant and its release, so neither reaches it
  - client: c2
    msg: {t: 2, idx: "refr:13488"}
    legacy: 0
    wire: 2
    reason: Camilla's record ahead of the two words of the swap to epoch 2 naming c2, the new host (the release's flip and the grant's)
  - client: c2
    msg: {t: 7, refrId: 0x13488, propName: isHostedByOther, dataDump: "false"}
    legacy: 0
    wire: 2
    reason: c2 named for Camilla by both flips of the swap to epoch 2; c2 came after epoch 1's grant and left before epoch 3's
