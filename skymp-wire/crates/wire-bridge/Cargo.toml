[package]
name = "wire-bridge"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "cxx bridge: the C++ server polls the wire for SkyMP JSON and sends its own (ADR-019). unsafe allowed here, reviewed."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
wire-schema = { path = "../wire-schema" }
wire-json = { path = "../wire-json" }
wire-validate = { path = "../wire-validate" }
wire-transport = { path = "../wire-transport" }
cxx.workspace = true

# No build script: the C++ glue for this bridge is generated by cxxbridge and
# compiled in the C++ build (corrosion_add_cxxbridge in cmake/wire.cmake), by
# the server's own compiler. The Rust tests here need no glue.

[lints.rust]
unsafe_code = "allow"   # FFI crate. Every unsafe block carries a SAFETY comment.
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
