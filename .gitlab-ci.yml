# GitLab CI for the skymp fork, branch parity (ADR-016). Runs only on the
# dedicated sky-ci runner (tag `sky`, docker executor with the host socket).
# Rust jobs cover skymp-wire; the server job builds the C++ server the
# upstream way, entirely inside `docker build`, and runs T0 there.
#
# Upstream's own GitHub workflows keep running on the public mirror; this
# file is ours and lives only on parity.

stages: [image, wire, server]

variables:
  GIT_SUBMODULE_STRATEGY: none
  RUST_CI_IMAGE: thuum/rust-ci:latest
  FUZZ_SECONDS: "120"

# Build the Rust CI image on the runner host's daemon; persists across jobs
# (pull policy if-not-present). Runs on every wire change: with the layers
# cached on the host it takes seconds, and the wire jobs below need it to
# exist before they start (a missing image is a runner configuration error).
rust-image:
  stage: image
  tags: [sky]
  image: docker:27
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes: [skymp-wire/**/*]
  script:
    - docker build -t "$RUST_CI_IMAGE" skymp-wire/ci

.wire:
  tags: [sky]
  image: $RUST_CI_IMAGE
  needs: [rust-image]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes: [skymp-wire/**/*]
  cache:
    key: wire-cargo
    paths: [skymp-wire/target/, .cargo/registry/]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - cd skymp-wire

# The gate CLAUDE.md calls `just wire-test`: tests, clippy with the deny set,
# cargo-deny, and the committed C header must match a fresh cbindgen run.
wire-test:
  extends: .wire
  stage: wire
  script:
    - cargo test --workspace --all-features
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    - cargo deny check
    - (cd crates/wire-client-ffi && cbindgen --config cbindgen.toml --crate wire-client-ffi --output /tmp/skymp_wire.h && diff -u include/skymp_wire.h /tmp/skymp_wire.h)

# A Linux difftest binary plus the session files, for sky-srv: `just test-proto`
# runs it inside the server image next to the fakeclient (docs/WIRE.md, Track W
# step 8). Also runs when only this file changes, so the artifact exists before
# the next wire change; the Rust image is then already on sky-ci.
difftest-build:
  extends: .wire
  stage: wire
  needs: [{ job: rust-image, optional: true }]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes: [skymp-wire/**/*, .gitlab-ci.yml]
  script:
    - cargo build --release -p difftest
    - mkdir -p ../difftest-dist && cp target/release/difftest ../difftest-dist/ && cp -r difftest/sessions ../difftest-dist/
  artifacts:
    name: difftest-$CI_COMMIT_SHORT_SHA
    paths: [difftest-dist/]
    expire_in: 30 days

# Bounded fuzzing per push; the nightly schedule sets FUZZ_SECONDS to an hour.
# A crash leaves its input under fuzz/artifacts as a job artifact.
wire-fuzz:
  extends: .wire
  stage: wire
  parallel:
    matrix:
      - TARGET: [codec_decode, validate, transport_ingest, json_recognize]
  script:
    - cargo +nightly fuzz run "$TARGET" -- -max_total_time="$FUZZ_SECONDS"
  artifacts:
    when: on_failure
    paths: [skymp-wire/fuzz/artifacts/]
    expire_in: 1 month

# C++ server, the upstream way, inside one docker build: ci/server.Dockerfile
# starts from upstream's published skymp-vcpkg-deps image (tag pinned from
# misc/github_env_linux) so nothing of vcpkg is rebuilt. T0 runs inside the
# build when the master .esm files are present; without them the build says
# so and skips ctest. Runs on merge requests, parity pushes outside
# skymp-wire, and the schedule.
server-build:
  stage: server
  tags: [sky]
  image: docker:27
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "parity"
      changes:
        - "**/*"
        - "!skymp-wire/**/*"
    # a milestone's branches (m1-*, m2-*, ...) build the server with the
    # wire on every push (the M2 ones had only their wire jobs, 2026-10-09)
    - if: $CI_COMMIT_BRANCH =~ /^m[0-9]+-/
  script:
    - |
      if [ -n "${SKYRIM_DATA_URL:-}" ]; then
        mkdir -p skyrim_data_files
        for f in Skyrim.esm Update.esm Dawnguard.esm HearthFires.esm Dragonborn.esm; do
          if ! wget -q -O "skyrim_data_files/$f" "$SKYRIM_DATA_URL/$f"; then
            echo "$f not available at SKYRIM_DATA_URL: building without master files, ctest will be skipped"
            rm -rf skyrim_data_files
            break
          fi
        done
      else
        echo "SKYRIM_DATA_URL unset: building without master files, ctest will be skipped"
      fi
    - VCPKG_URL=$(git config -f .gitmodules submodule.vcpkg.url)
    - VCPKG_COMMIT=$(git ls-tree HEAD vcpkg | awk '{print $3}')
    - echo "vcpkg $VCPKG_URL @ $VCPKG_COMMIT"
    # Tagged by branch: parity is what sky-srv's compose runs; a port branch
    # (m1-wire) ships beside it as skymp-server:m1-wire and never replaces it.
    - TAG="$CI_COMMIT_REF_SLUG"
    - docker build -f ci/server.Dockerfile --build-arg "VCPKG_URL=$VCPKG_URL" --build-arg "VCPKG_COMMIT=$VCPKG_COMMIT" -t "skymp-server:$TAG-$CI_COMMIT_SHORT_SHA" .
    - docker tag "skymp-server:$TAG-$CI_COMMIT_SHORT_SHA" "skymp-server:$TAG"
    # Ship to the sky-ci registry sky-srv pulls from (10.10.70.12:5000).
    - docker tag "skymp-server:$TAG-$CI_COMMIT_SHORT_SHA" "localhost:5000/skymp-server:$TAG-$CI_COMMIT_SHORT_SHA"
    - docker tag "skymp-server:$TAG-$CI_COMMIT_SHORT_SHA" "localhost:5000/skymp-server:$TAG"
    - docker push "localhost:5000/skymp-server:$TAG-$CI_COMMIT_SHORT_SHA"
    - docker push "localhost:5000/skymp-server:$TAG"

# The Windows client and Skyrim Platform build (thuum, 2026-10-05): the `dist`
# the lab clients run, built on sky-build (VM 720, tag `windows`, a shell
# runner with pwsh) the way upstream's .github/actions/pr_base does it, so
# client builds leave GitHub Actions and join this pipeline. Off until the
# runner exists: set the project variable CLIENT_BUILD_WINDOWS to 1. vcpkg
# keeps its binary cache on the VM's own D: (no NuGet feed). The master files
# come from our own copies (SKYRIM_DATA_URL), never from upstream's public
# download (cmake/download_skyrim_data.cmake), so DOWNLOAD_SKYRIM_DATA stays
# off and UNIT_DATA_DIR points at the fetched files. The generator is pinned:
# CMakeLists.txt accepts only Visual Studio 17 2022, and cmake's default is
# the newest Visual Studio on the machine.
client-build:
  stage: server
  tags: [windows]
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: "1"
    VCPKG_BINARY_SOURCES: "clear;files,D:/vcpkg-bincache,readwrite"
    VCPKG_FEATURE_FLAGS: "manifests"
  rules:
    - if: $CLIENT_BUILD_WINDOWS != "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "parity"
    - if: $CI_COMMIT_BRANCH =~ /^m[0-9]+-/
  script:
    - New-Item -ItemType Directory -Force D:/vcpkg-bincache, skyrim_data_files | Out-Null
    - |
      foreach ($f in 'Skyrim.esm', 'Update.esm', 'Dawnguard.esm', 'HearthFires.esm', 'Dragonborn.esm') {
        Invoke-WebRequest -UseBasicParsing -Uri "$env:SKYRIM_DATA_URL/$f" -OutFile "skyrim_data_files/$f"
      }
    - Push-Location skymp5-client; yarn --frozen-lockfile; if ($LASTEXITCODE) { exit 1 }; yarn build; if ($LASTEXITCODE) { exit 1 }; Pop-Location
    - .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
    - |
      cmake -B build -G "Visual Studio 17 2022" -A x64 "-DVCPKG_ROOT=$PWD/vcpkg" -DUNIT_DATA_DIR=skyrim_data_files -DDOWNLOAD_SKYRIM_DATA=OFF `
        -DBUILD_NODEJS=OFF -DBUILD_FRONT=OFF -DPREPARE_NEXUS_ARCHIVES=OFF -DCMAKE_BUILD_TYPE=Release `
        -DSKYRIM_VR=OFF -DCPPCOV_PATH=OFF
      if ($LASTEXITCODE) { exit 1 }
    - cmake --build build --config Release; if ($LASTEXITCODE) { exit 1 }
  artifacts:
    name: dist
    paths: [build/dist]
    expire_in: 14 days
