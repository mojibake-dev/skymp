# difftest trigger-look (thuum ADR-068 D-W2 A, Eli 2026-11-07; docs/research/
# fifty-fixes-2026-11-07.md section 7.2(b) and 7.3's S5 proof; ScriptCall
# MsgType 75 and SpSnippet 30, no schema change): during a firing its
# presser's owner started, that seat owns the trap family trigger's own
# calls on itself, so a guest's script call on a world object is a firing's
# look, judged by the firing's rule over the subject's facts (the cell's host
# at the epoch, or a game with the cell loaded one of whose actors stands
# within the subject's firing reach, wire-rules natives' look_owner) and
# relayed to the subject's other listeners with its next sequence, kept
# nowhere. c1 and c2 are new characters (profiles 9 and 10, actors
# 0xff000002 and 0xff000003, see melee-reach), both at the spawn (133857,
# -61130, 14662) in Tamriel's exterior cell (32, -15), form 0xbbb1
# (cell-host's read); c2 starts 1.5 s after c1, and each client's times below
# are its own. At 1 s c1 reports the cell loaded and is granted it, HostGrant
# {cell 0xbbb1, epoch 1}, as in cell-host. The subject is trigger-entry's and
# script-call's ore vein 0x10e6c5 (ACTI MineOreIron01_LFallForestDirt at
# (134931, -58398, 10752), in the same cell, a world object the server loads
# with the spawn's chunk, no actor): the server judges a world object, not
# its kind (it reads no script archive in the lab), and the spawn is a summit
# with no trigger in reach a session could name (docs/LAB.md's summit note).
# At 1 s c2 reports the cell loaded (nothing: c1 hosts it). At 1.2 s, still
# at the spawn, some 4,900 units off the vein, c2 reports
# ObjectReference.PlayAnimation("Open") on it with epoch 0 (a guest holds no
# grant): refused E_SCRIPTCALL_FAR (a game with the cell loaded whose nearest
# actor stands past the firing reach, 452 units plus the vein's size plus
# 512), said by its name in the wire server's log, nothing sent. c2 then
# walks onto the vein's origin in trigger-entry's two moves within its ground
# budget (2048 units, then 660 a second; height is free, wire-rules
# movement): at 1.5 s half the way, at 3.5 s the rest, 1468 units over the
# ground each, the vein's cell all along, so no view changes. At 4 s c2
# reports the same call there: its firing's look, relayed to c1 alone, the
# vein's other listener, as SpSnippet ObjectReference.PlayAnimation on the
# vein with seq 1 (snippetIdx 0xFFFFFFFF, no answer; the refusal took no
# sequence), and kept nowhere. At 4.5 s c2 reports the cell gone from its
# loaded set, so c1's departure leaves it unhosted after the grace with
# nothing to c2. At 6 s c1, the host, reports the same call under an epoch
# the cell does not stand at (2): its own channel's refusal (E_SCRIPTCALL_OWNER;
# a host's report under another grant is never a look, ADR-066), nothing
# sent; the step also keeps c1 connected past c2's look. The legacy server
# knows no MsgType 75 and drops all three. c2 steps aside at 8 s, one unit,
# so it outlives c1, as in every session. The look channel's other refusals
# (E_SCRIPTCALL_LOOK_RATE, the look-only rows' E_SCRIPTCALL_ROW) and its
# other rows (Sound.Play with no sequence, CreateDetectionEvent to the cell's
# host alone) are T0's (unit/ScriptCallLookTest.cpp and the wire-rules
# crate's).
id: trigger-look
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 1000, send: {t: 47, cell: 0xbbb1, loaded: true}, reliable: true}
  - {client: c2, at_ms: 1000, send: {t: 47, cell: 0xbbb1, loaded: true}, reliable: true}
  - {client: c2, at_ms: 1200, send: {t: 75, epoch: 0, selfId: 0x10e6c5, cls: ObjectReference, fn: PlayAnimation, args: [Open], caller: "", handler: "", latent: false}, reliable: true}
  - {client: c2, at_ms: 1500, move: {dx: 537, dy: 1366, dz: -1955}}
  - {client: c2, at_ms: 3500, move: {dx: 1074, dy: 2732, dz: -3910}}
  - {client: c2, at_ms: 4000, send: {t: 75, epoch: 0, selfId: 0x10e6c5, cls: ObjectReference, fn: PlayAnimation, args: [Open], caller: "", handler: "", latent: false}, reliable: true}
  - {client: c2, at_ms: 4500, send: {t: 47, cell: 0xbbb1, loaded: false}, reliable: true}
  - {client: c1, at_ms: 6000, send: {t: 75, epoch: 2, selfId: 0x10e6c5, cls: ObjectReference, fn: PlayAnimation, args: [Open], caller: "", handler: "", latent: false}, reliable: true}
  - {client: c2, at_ms: 8000, move: {dx: 1075, dy: 2732, dz: -3910}}
divergences:
  - client: c1
    msg: {t: 48, cell: 0xbbb1, epoch: 1}
    legacy: 0
    wire: 1
    reason: the first loader in reach hosts the cell (HostGrant, thuum docs/verbs/cell-host.md); the legacy server has no cell hosts
  - client: c1
    msg: {t: 30, class: ObjectReference, function: PlayAnimation, selfId: 0x10e6c5, arguments: [Open], seq: 1}
    legacy: 0
    wire: 1
    reason: the guest's call on the vein from its origin, with the cell loaded, is its firing's look (thuum ADR-068 D-W2 A), relayed to the subject's other listener with its first sequence and kept nowhere; the legacy server knows no MsgType 75
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
