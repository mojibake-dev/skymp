# difftest npc-lead (thuum ADR-073 decision 6 with D-53-4 and D-PO2 A, step 5a; docs/verbs/npc-talk.md): a quest's
# lead, a claim the game running the quest's own package on one of the quest's alias actors holds with no lease and
# no reach, outlives a grant of its cell, holds the actor against another seat's claim of any purpose, and ends at
# its release (wire-rules cells claim(), grant(), unloaded(); T0 a_lead_is_the_simulators_alone_and_wants_no_loaded_
# cell, camillas_lead_goes_through_the_door_and_outlives_the_grant_of_the_cell_outside, the_first_holder_keeps_the_
# actor_against_any_purpose_and_takes_its_own). c1 and c2 are new characters (profiles 9 and 10, actors 0xff000002
# and 0xff000003, see melee-reach); c2 starts 1.5 s after c1, each client's times its own. The records (Skyrim.esm,
# read on sky-srv for step 5a's design, 2026-11-14): MS13 0x39645's alias 9 "Camilla" fills by her unique actor (ALUA
# 0x1347b), her ACHR 0x13488 in RiverwoodTrader 0x133c9; the package 0x2e4cc's owner quest (QNAM) is MS13. Each client
# reaches the trader through `moveto` onto Camilla's record (an owner's console command, see claim-outlives-grant)
# and names her by the server's index, "{{idx:0x13488}}" (fork wire-fakeclient). The legacy server knows neither
# MsgType 56 nor `moveto`: on the legacy stack both clients stay at the spawn and nothing below happens.
#
# At 0.2 s c1 goes to Camilla and at 1 s reports the trader loaded: it hosts the cell (HostGrant {cell 0x133c9, epoch
# 1}), so its game simulates her. At 2 s c1 claims her lead {purpose 1, quest 0x39645, package 0x2e4cc}: the server
# reads the quest (a QUST its run record does not hold stopped), the package's QNAM (MS13) and her fill (alias 9, its
# unique actor), and the table grants it to the simulator; a host's own lead moves no simulator, so no keyframe and
# no word. c2 goes to Camilla at 0.5 s of its own and reports the trader loaded at 1.5 s (hosted: nothing). At 4.5 s c1
# reports the trader unloaded: the unload keeps the lead (its holder's engine may run her in a cell its game has
# unloaded, R-C2) and arms c1's grace; at its end the cell passes to c2 (HostRelease {epoch 1} to c1, HostGrant {epoch
# 2} to c2), and the grant passes over the lead: the flips name c1 for Camilla (her keyframe to c1, isHostedByOther
# false to c1 and true to c2) and c2 for Lucan 0x13487 (his keyframe to c2, the words the other way). At 10.5 s of its
# own c2, now the host, claims the same lead, and at 11 s a dialogue with her: both Held (E_CLAIM_HELD in the wire
# server's log, the holder's purpose named), so nothing reaches either game. At 14 s c1 releases the lead {claim false,
# purpose 1, quest 0x39645, package 0x2e4cc}: the row ends and the cell's rule names its host, c2 (her keyframe to c2,
# isHostedByOther false to c2 and true to c1). c2 reports the trader loaded again at 16 s of its own (a repeat:
# nothing), so it outlives c1 and sees c1's departure, both in the trader.
#
# UpdateMovement compares exactly here (not as presence): the server sends a keyframe (PartOne::SendActorKeyframe, a
# t:2) to the simulator ahead of each word, neither client moves, and a keyframe in relays_seen could not be declared.
#
# Not declared yet: the first T2 of this session (ONLY=npc-lead) draws what the code alone does not fix: the forms of
# the spawn leaving each client's view at its moveto (DestroyActor 25, the lock chest 0xf321a among them); the trader's
# references entering it (CreateActor 33, Lucan and Camilla among them); each player's create word for the other, at
# the spawn on the legacy stack and in the trader on the wire; the words (UpdateProperty 7 isHostedByOther on Lucan
# and Camilla, one to each listening player per grant, release and claim flip) and the keyframes, by count; and any
# fate (ActorFate 51), record (ChangeFormApply 74) or script state (ScriptStateApply 77, ahead of a grant) the
# trader's load and grants serve. Each is read against the paragraph above before it is declared.
id: npc-lead
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
volatile: [3, 24]
steps:
  - {client: c1, at_ms: 200, send: {t: 12, data: {t: 12, commandName: moveto, args: [20, 0x13488]}}, reliable: true}
  - {client: c1, at_ms: 1000, send: {t: 47, cell: 0x133c9, loaded: true}, reliable: true}
  - {client: c1, at_ms: 2000, send: {t: 56, idx: "{{idx:0x13488}}", claim: true, purpose: 1, quest: 0x39645, package: 0x2e4cc}, reliable: true}
  - {client: c2, at_ms: 500, send: {t: 12, data: {t: 12, commandName: moveto, args: [20, 0x13488]}}, reliable: true}
  - {client: c2, at_ms: 1500, send: {t: 47, cell: 0x133c9, loaded: true}, reliable: true}
  - {client: c1, at_ms: 4500, send: {t: 47, cell: 0x133c9, loaded: false}, reliable: true}
  - {client: c2, at_ms: 10500, send: {t: 56, idx: "{{idx:0x13488}}", claim: true, purpose: 1, quest: 0x39645, package: 0x2e4cc}, reliable: true}
  - {client: c2, at_ms: 11000, send: {t: 56, idx: "{{idx:0x13488}}", claim: true}, reliable: true}
  - {client: c1, at_ms: 14000, send: {t: 56, idx: "{{idx:0x13488}}", claim: false, purpose: 1, quest: 0x39645, package: 0x2e4cc}, reliable: true}
  - {client: c2, at_ms: 16000, send: {t: 47, cell: 0x133c9, loaded: true}, reliable: true}
divergences:
  - client: c1
    msg: {t: 41, text: "moveto done", refused: false}
    legacy: 0
    wire: 1
    reason: an owner's moveto runs the server's teleport and answers with a line (thuum docs/verbs/console-commands.md); the legacy server does not know the command
  - client: c1
    msg: {t: 20, idx: "refr:ff000002", worldOrCell: 0x133c9}
    legacy: 0
    wire: 1
    reason: the moveto's teleport onto Camilla's record in RiverwoodTrader 0x133c9 (MpActor::Teleport); the legacy server stays silent
  - client: c1
    msg: {t: 48, cell: 0x133c9, epoch: 1}
    legacy: 0
    wire: 1
    reason: the first loader in reach hosts the trader (HostGrant, thuum docs/verbs/cell-host.md), and so simulates Camilla, the lead's claimant (D-PO2 A); the legacy server has no cell hosts
  - client: c1
    msg: {t: 49, cell: 0x133c9, epoch: 1}
    legacy: 0
    wire: 1
    reason: c1's unload ran out its grace and the trader passed to c2 (HostRelease of epoch 1); its lead stays, an unload ends a talk alone
  - client: c2
    msg: {t: 41, text: "moveto done", refused: false}
    legacy: 0
    wire: 1
    reason: an owner's moveto, as c1's; the legacy server does not know the command
  - client: c2
    msg: {t: 20, idx: "refr:ff000003", worldOrCell: 0x133c9}
    legacy: 0
    wire: 1
    reason: c2's teleport onto Camilla's record in the trader
  - client: c2
    msg: {t: 48, cell: 0x133c9, epoch: 2}
    legacy: 0
    wire: 1
    reason: the trader passed to the visitor with it loaded and in reach, at the next epoch; c1's lead on Camilla passes over the grant (ADR-073 decision 6)
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout (both clients in the trader on the wire)
