# difftest target-by-hit (M2 train-27, thuum docs/verbs/spell-cast.md, the
# target by first hit): c1 and c2 are new characters (profiles 9 and 10,
# actors 0xff000002 and 0xff000003: see melee-reach), c2 50 units off the
# spawn. At 1.5 s c1 learns TrapDiseaseWitbane (Skyrim.esm 0x10A250,
# 1090128: one effect delivered by touch, TrapDisDamageMagickaRegen
# 0x10A252, a magicka regeneration modifier with no health change; lab/esm.py
# on sky-srv 2026-10-18, landing-spells) and holds it in its right hand at
# 2 s. At 3 s c1 casts it with target 0, as a caster's game does when its
# crosshair found nobody (playtest twenty-three: every Shadowbond and Azure
# Reconstruction cast). The fixed server holds the cast (a spell delivered to
# its target waits for its first hit) and relays it at 3.4 s, when c1's hit
# on c2 names the target, with c2's id; the hit's effect goes on the server's
# record of c2 and to both games (MagicEffects), and the hostile hit begins a
# fight (StartCombat told to c2's game). The legacy server never learned the
# spell (its console has no addspell), refuses it in the hand and relays no
# cast, so the first T2 run (20261019-0231, 28 differences) showed no relay
# on it at all; nothing of this is declared against it beyond that. c2 steps
# again at 4 s of its own, so it outlives c1, as in every session. The first
# session shape used a Poison-type spell with a health effect whose
# regeneration ticks were timing-dependent; a disease has none.
# Train-27's conditions evaluator (thuum ADR-039) refused the hit's effect,
# TrapDiseaseWitbane's, as gated on a function it did not know, so for a
# day no MagicEffects record (t 43) and no StartCombat followed the claimed
# hit (T2 20261019-0000 on c32cf0bd). Train-28's functions (GetIsID,
# GetGlobalValue, IsHostileToActor) evaluate it and it holds, so the effect
# is applied once and shown to both games (t 43, magnitude 0.5, no
# duration) and the hostile hit begins a fight (StartCombat to c2), as on
# 2026-10-18 before the evaluator (first T2 run 20261019-1407); the relay at
# the first hit, the session's point, is unchanged.
id: target-by-hit
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 1500, send: {t: 12, data: {t: 12, commandName: addspell, args: [20, 1090128]}}}
  - {client: c1, at_ms: 2000, send: {t: 5, idx: "{{idx}}", data: {inv: {entries: []}, rightSpell: 1090128, numChanges: 1}}}
  - {client: c1, at_ms: 3000, send: {t: 23, data: {caster: 20, target: 0, spell: 1090128, isDualCasting: false, interruptCast: false, castingSource: 1, aimAngle: 0, aimHeading: 0, hasLaunch: false, originX: 0, originY: 0, originZ: 0, launchAngleX: 0, launchAngleZ: 0, actorAnimationVariables: {booleans: [], floats: [], integers: []}}}}
  - {client: c1, at_ms: 3400, send: {t: 17, data: {aggressor: 20, target: 4278190083, source: 1090128, isBashAttack: false, isHitBlocked: false, isPowerAttack: false, isSneakAttack: false, projectile: 0}}}
  - {client: c2, at_ms: 0, move: {dx: 50}}
  - {client: c2, at_ms: 4000, move: {dx: 60}}
divergences:
  - client: c1
    msg: {t: 41, text: "addspell done: 10a250 recorded", refused: false}
    legacy: 0
    wire: 1
    reason: an owner's AddSpell writes the server's record of learned spells and answers with a line (thuum docs/verbs/cast-teleport.md); the legacy server does not know the command
  - client: c1
    msg: {t: 30, class: Actor, function: AddSpell, arguments: [{formId: 1090128, type: Spell}, false]}
    legacy: 0
    wire: 1
    reason: the recorded spell is told to c1's own game
  - client: c1
    msg: {t: 5, data: {rightSpell: 1090128}}
    legacy: 0
    wire: 1
    reason: the wire stack takes the learned spell in the right hand and relays it, c1's own game included (it listens to itself); the legacy stack refuses it
  - client: c2
    msg: {t: 5, data: {rightSpell: 1090128}}
    legacy: 0
    wire: 1
    reason: the same relay reaches c2
  - client: c1
    msg: {t: 30, class: Actor, function: RemoveSpell, arguments: [{formId: 1090128, type: Spell}]}
    legacy: 1
    wire: 0
    reason: the legacy stack refuses a spell c1 never learned and takes it from c1's game (upstream #2665)
  - client: c1
    msg: {t: 28, inventory: {entries: [{baseId: 10, count: 10}, {baseId: 15, count: 140}, {baseId: 77382, count: 1}, {baseId: 77385, count: 1}, {baseId: 77387, count: 1}, {baseId: 77389, count: 1}, {baseId: 77494, count: 1}, {baseId: 77495, count: 1}, {baseId: 79760, count: 1}, {baseId: 80253, count: 23}, {baseId: 80254, count: 1}, {baseId: 120044, count: 2}, {baseId: 236362, count: 2}, {baseId: 243042, count: 1}, {baseId: 256733, count: 5}, {baseId: 256736, count: 5}, {baseId: 256741, count: 5}, {baseId: 256810, count: 1}, {baseId: 256819, count: 1}, {baseId: 1017598, count: 1}]}}
    legacy: 1
    wire: 0
    reason: the legacy stack's refusal of the spell sends c1 its inventory again (upstream #2665)
  - client: c2
    msg: {t: 23, data: {target: 4278190083}}
    legacy: 0
    wire: 1
    reason: the fixed server relays the cast at its first hit, with the target the hit names (the legacy server, which never learned the spell, relays no cast at all)
  - client: c1
    msg: {t: 43}
    legacy: 0
    wire: 1
    reason: the hit's effect, its conditions evaluated and holding (ADR-039, train-28's functions), applied to c2 once and shown to every game that sees c2, c1's included; the legacy server saw no cast to claim the hit against
  - client: c2
    msg: {t: 43}
    legacy: 0
    wire: 1
    reason: the same set to c2's own game
  - client: c2
    msg: {t: 30, class: Actor, function: StartCombat}
    legacy: 0
    wire: 1
    reason: the claimed hostile hit, its effect held, begins a fight and the victim's game is told (ADR-023)
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
