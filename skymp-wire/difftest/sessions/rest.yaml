# difftest rest (M1, thuum docs/verbs/rest.md): c1 and c2 are new characters
# (profiles 9 and 10, actors 0xff000002 and 0xff000003: see melee-reach),
# both at the spawn. c2 sends a bare-handed hit on c1 at 3.5 s; standing on
# each other passes the cone, and both servers lower c1's health. c1 rests
# an hour at 5 s, inside the 10 s after the hit: the legacy server has no
# RestIntent and the fixed one refuses a fight, so neither answers. c1 rests
# again at 16 s: the fixed server restores it to full and tells it
# (ChangeValues); the legacy server cannot.
id: rest
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c2, at_ms: 3500, send: {t: 17, data: {aggressor: 20, target: 4278190082, source: 500, isBashAttack: false, isHitBlocked: false, isPowerAttack: false, isSneakAttack: false, projectile: 0}}}
  - {client: c1, at_ms: 5000, send: {t: 35, hours: 1, sleep: false}}
  - {client: c1, at_ms: 16000, send: {t: 35, hours: 1, sleep: false}}
divergences:
  - client: c1
    msg: {t: 16, data: {health: 1, magicka: 1, stamina: 1}}
    legacy: 0
    wire: 1
    reason: a rest after the fight window; the fixed server grants its recovery (thuum docs/verbs/rest.md), the legacy one has no RestIntent
  - client: c2
    msg: {t: 25, idx: 2}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
