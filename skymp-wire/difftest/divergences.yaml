# Divergences every client of every session shows, legacy against wire,
# declared once instead of in each session file. Reviewed like validator
# changes. Each entry applies to every client with the counts given, and one
# that stops occurring as declared is a difference, as a session's own is.
divergences:
  # thuum docs/verbs/time.md (ADR-021): the server's game clock. The wire
  # server tells each player the time at login (SetGameTime, MsgType 34) and
  # again every 60 s; every session is shorter than that. The legacy server
  # has no clock and no such message.
  - msg: {t: 34}
    legacy: 0
    wire: 1
    reason: the game clock at login (SetGameTime, thuum ADR-021); the legacy server has none

  # thuum docs/verbs/player-globals.md (train-30's early send): the player's
  # own globals. The wire server tells each player the globals it watches and
  # their recorded values (a silent record gets the entry's default) at the
  # login itself (PlayerGlobals, MsgType 45), right after the clock; until
  # train-30 it rode the first movement report, so only the sessions whose
  # clients moved declared it. The legacy server has no such message.
  - msg: {t: 45}
    legacy: 0
    wire: 1
    reason: the player's globals at login (PlayerGlobals, thuum docs/verbs/player-globals.md); the legacy server has none

  # thuum docs/verbs/quest-stage.md (ADR-056): the world's quest stages. The
  # wire server tells each player the quests it shares (QuestStage, MsgType
  # 57, quest 0 with the list) at the login itself, right after the globals,
  # then the world's recorded stages one by one (none in a fresh T2 world).
  # The legacy server has no such message.
  - msg: {t: 57, quest: 0}
    legacy: 0
    wire: 1
    reason: the shared quests at login (QuestStage, thuum docs/verbs/quest-stage.md); the legacy server has none

  # thuum docs/verbs/magic-effects.md (memo D56 A, 2026-10-28): the cure. The
  # wire server tells each player at login to drop every listed disease
  # spell (cureSpells: DiseaseSanguinareVampiris 0xb8780) through one
  # SpSnippet Actor.RemoveSpell on the player's own actor (selfId 0x14), and
  # again every 60 s; every session is shorter than that. The legacy server
  # has no cure and sends no such snippet. Matched by the spell's id, so a
  # session's own RemoveSpell (the Rested effect at a wake) stays its own.
  - msg: {t: 30, class: Actor, function: RemoveSpell, arguments: [{formId: 755584, type: Spell}]}
    legacy: 0
    wire: 1
    reason: the cure of the listed diseases at login (SpSnippet Actor.RemoveSpell 0xb8780, thuum memo D56 A); the legacy server has none
