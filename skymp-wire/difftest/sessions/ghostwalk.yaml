# difftest ghostwalk (M2, thuum docs/verbs/ghostwalk.md): c1 and c2 are new
# characters (profiles 9 and 10, actors 0xff000002 and 0xff000003: see
# melee-reach), c2 50 units off the spawn. The lab server runs with
# enableConsoleCommandsForAll (see console), so both are owners on the wire
# stack. Its settings name Apocalypse's Ghostwalk as a return (castTeleports:
# reach 0, waitMs 15400, relay true; "Apocalypse - Magic of Skyrim.esp" SPEL
# 00AAE8 at full slot 0C of the lab's load order with thuum branch
# apocalypse's layer, so 0x0C00AAE8, 201370344, the same in every client's),
# and both stacks load the plugin. At 1.5 s c1 adds itself the spell
# (AddSpell, an admin's) and at 2 s reports it in its right hand, as in
# teleports. At 2.5 s c1 moves 3000 units north with no cast: the wire stack
# sends it back (Teleport2: beyond the 2048-unit ground budget, no permit),
# the legacy stack takes it; at 3 s c1 reports from the spawn again, which
# both stacks take (the wire stack holds c1 there already, the legacy stack
# takes a move under 4096). At 3.5 s c1 casts Ghostwalk (SpellCast, Self, the
# right hand): the wire stack records the cast at the spawn, permits the
# return and relays the cast (relay true: c2's game would make c1's figure
# invisible); the legacy stack relays nothing, the spell in no slot of c1's.
# From 4.5 s to 9 s c1 walks 2800 units north in four steps of 700 every
# 1.5 s, within the budget on both stacks. At 13.9 s (the cast and the
# effect's 10.4 s) c1 reports from the spawn, the mod's script's return: a
# 2800-unit jump past the budget, which the wire stack takes as the
# permitted return and the legacy stack as any move under 4096. So both
# stacks end with c1 at the spawn. c2 steps again at 16 s of its own, so it
# outlives c1, as in every session.
# The divergences below are teleports' that apply here (2026-10-16), and
# the first run's (T2 21:27, 2026-10-16, with the layer on sky-srv): the
# self-cast's effect on the wire stack, its start and its end, to both.
id: ghostwalk
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 1500, send: {t: 12, data: {t: 12, commandName: addspell, args: [20, 201370344]}}}
  - {client: c1, at_ms: 2000, send: {t: 5, idx: "{{idx}}", data: {inv: {entries: []}, rightSpell: 201370344, numChanges: 1}}}
  - {client: c1, at_ms: 2500, move: {dy: 3000}}
  - {client: c1, at_ms: 3000, move: {dy: 0}}
  - {client: c1, at_ms: 3500, send: {t: 23, data: {caster: 20, target: 0, spell: 201370344, isDualCasting: false, interruptCast: false, castingSource: 1, aimAngle: 0, aimHeading: 0, hasLaunch: false, originX: 0, originY: 0, originZ: 0, launchAngleX: 0, launchAngleZ: 0, actorAnimationVariables: {booleans: [], floats: [], integers: []}}}}
  - {client: c1, at_ms: 4500, move: {dy: 700}}
  - {client: c1, at_ms: 6000, move: {dy: 1400}}
  - {client: c1, at_ms: 7500, move: {dy: 2100}}
  - {client: c1, at_ms: 9000, move: {dy: 2800}}
  - {client: c1, at_ms: 13900, move: {dy: 0}}
  - {client: c2, at_ms: 0, move: {dx: 50}}
  - {client: c2, at_ms: 16000, move: {dx: 60}}
divergences:
  - client: c1
    msg: {t: 41, text: "addspell done: c00aae8 recorded", refused: false}
    legacy: 0
    wire: 1
    reason: an owner's AddSpell writes the server's record of learned spells and answers with a line (thuum docs/verbs/cast-teleport.md); the legacy server does not know the command
  - client: c1
    msg: {t: 30, class: Actor, function: AddSpell, arguments: [{formId: 201370344, type: Spell}, false]}
    legacy: 0
    wire: 1
    reason: the recorded spell is told to c1's own game
  - client: c1
    msg: {t: 5, data: {rightSpell: 201370344}}
    legacy: 0
    wire: 1
    reason: the wire stack takes the learned spell in the right hand and relays it, c1's own game included; the legacy stack refuses it
  - client: c2
    msg: {t: 5, data: {rightSpell: 201370344}}
    legacy: 0
    wire: 1
    reason: the same relay reaches c2
  - client: c1
    msg: {t: 30, class: Actor, function: RemoveSpell, arguments: [{formId: 201370344, type: Spell}]}
    legacy: 1
    wire: 0
    reason: the legacy stack refuses a spell c1 never learned and takes it from c1's game (upstream #2665)
  - client: c1
    msg: {t: 28, inventory: {entries: [{baseId: 10, count: 10}, {baseId: 15, count: 140}, {baseId: 77382, count: 1}, {baseId: 77385, count: 1}, {baseId: 77387, count: 1}, {baseId: 77389, count: 1}, {baseId: 77494, count: 1}, {baseId: 77495, count: 1}, {baseId: 79760, count: 1}, {baseId: 80253, count: 23}, {baseId: 80254, count: 1}, {baseId: 120044, count: 2}, {baseId: 236362, count: 2}, {baseId: 243042, count: 1}, {baseId: 256733, count: 5}, {baseId: 256736, count: 5}, {baseId: 256741, count: 5}, {baseId: 256810, count: 1}, {baseId: 256819, count: 1}, {baseId: 1017598, count: 1}]}}
    legacy: 1
    wire: 0
    reason: the legacy stack's refusal of the spell sends c1 its inventory again (upstream #2665)
  - client: c1
    msg: {t: 31}
    legacy: 0
    wire: 1
    reason: the move with no cast goes beyond c1's ground budget and the wire stack sends it back (Teleport2); the return after the cast is the permitted jump and stands; the legacy stack takes both
  - client: c2
    msg: {t: 23, data: {caster: 4278190082, spell: 201370344, castingSource: 1}}
    legacy: 0
    wire: 1
    reason: the wire stack relays a return's cast (its castTeleports entry says relay), so c2's game shows c1's figure invisible; the legacy stack refuses the unlearned spell and relays nothing
  - client: c2
    msg: {t: 25, idx: 2}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
  - client: c1
    msg: {t: 43, effects: [{effect: 201370341, source: 201370344}]}
    legacy: 0
    wire: 1
    reason: the wire stack runs the return's Self cast on the server (thuum docs/verbs/self-cast.md) and tells c1's own game its effect, Ghostwalk's 0C00AAE5 (201370341) from the spell 0C00AAE8, its Invisibility for 10 s (MagicEffects); the legacy stack refuses the unlearned spell
  - client: c1
    msg: {t: 43}
    legacy: 0
    wire: 1
    reason: the effect's end 10 s later, an empty set of running effects told to c1's game (after the declaration above sets the start aside, only the end is left to match)
  - client: c2
    msg: {t: 43, effects: [{effect: 201370341, source: 201370344}]}
    legacy: 0
    wire: 1
    reason: the same effect told to c2, which sees c1 (the figure invisible there)
  - client: c2
    msg: {t: 43}
    legacy: 0
    wire: 1
    reason: and its end, told to c2
  - client: c2
    msg: {t: 30, class: ObjectReference, function: SetPosition, selfId: 4278190082}
    legacy: 0
    wire: 1
    reason: Ghostwalk's look (thuum branch ghostwalk-look's settings, docs/verbs/ghostwalk.md) pops c1's figure in c2's game at the return, no glide; the legacy stack names no teleport
  - client: c2
    msg: {t: 30, class: VisualEffect, function: Play, selfId: 201459649}
    legacy: 0
    wire: 1
    reason: the return's own visual, RFCT 0207C1, played on c1's figure for 3 s
  - client: c2
    msg: {t: 30, class: Sound, function: Play, selfId: 201459647}
    legacy: 0
    wire: 1
    reason: the return's own sound, SOUN 0207BF, played on c1's figure
  - client: c1
    msg: {t: 45}
    legacy: 0
    wire: 1
    reason: the wire stack sends a player its globals to watch, and their recorded values, on its first movement after a login (docs/verbs/player-globals.md); the legacy server has no such message
  - client: c2
    msg: {t: 45}
    legacy: 0
    wire: 1
    reason: the same, for c2's login
