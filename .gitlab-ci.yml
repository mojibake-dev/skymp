# GitLab CI for the skymp fork, branch parity (ADR-016). Runs only on the
# dedicated sky-ci runner (tag `sky`, docker executor with the host socket).
# Rust jobs cover skymp-wire; the server job builds the C++ server the
# upstream way, entirely inside `docker build`, and runs T0 there.
#
# Upstream's own GitHub workflows keep running on the public mirror; this
# file is ours and lives only on parity.

stages: [image, wire, server]

variables:
  GIT_SUBMODULE_STRATEGY: none
  RUST_CI_IMAGE: thuum/rust-ci:latest
  FUZZ_SECONDS: "120"

# A failed fetch runs again by the stock levers where they exist: cargo's own retries (CARGO_NET_RETRY on the wire
# jobs) and PowerShell's (-MaximumRetryCount on the master files). The fetches with none, BuildKit's Docker Hub token
# and metadata (server-build), cargo-deny's advisory database (wire-test) and vcpkg's bootstrap download
# (client-build), run under ci/net-retry.sh or ci/net-retry.ps1: a failure whose last lines carry the fetch's own
# message (ci/net-failures.txt) exits 75, and the job runs again, twice at most. Any other failure keeps its own exit
# code and is never retried.
default:
  retry:
    max: 2
    exit_codes: [75]

# The image and wire jobs below run on a branch when the branch changes, against canon, a file they read
# (compare_to keeps a new branch's first push from counting every file as changed, and a later push from forgetting
# what an earlier one changed); on canon, as merged where a rule forces them, else when the push changes one.

# ci/net-retry.sh's own exits (ci/net-retry.test.sh), in the image server-build's wrapped step runs in
net-retry-test:
  stage: image
  tags: [sky]
  image: docker:27
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(api|web|schedule)$/
    - if: $CI_COMMIT_BRANCH == "canon"
      changes: [ci/net-retry.sh, ci/net-retry.test.sh, ci/net-failures.txt]
    - changes:
        paths: [ci/net-retry.sh, ci/net-retry.test.sh, ci/net-failures.txt]
        compare_to: refs/heads/canon
  script:
    - sh ci/net-retry.test.sh

# Build the Rust CI image on the runner host's daemon; persists across jobs
# (pull policy if-not-present). Runs on every wire change and every canon push:
# with the layers cached on the host it takes seconds, and the wire jobs below
# need it to exist before they start (a missing image is a runner configuration
# error).
rust-image:
  stage: image
  tags: [sky]
  image: docker:27
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "canon"
    - changes:
        paths: [skymp-wire/**/*]
        compare_to: refs/heads/canon
  script:
    - docker build -t "$RUST_CI_IMAGE" skymp-wire/ci

.wire:
  tags: [sky]
  image: $RUST_CI_IMAGE
  needs: [rust-image]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "canon"
      changes: [skymp-wire/**/*]
    - changes:
        paths: [skymp-wire/**/*]
        compare_to: refs/heads/canon
  cache:
    key: wire-cargo
    paths: [skymp-wire/target/, .cargo/registry/]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    CARGO_NET_RETRY: "5"
  before_script:
    - cd skymp-wire

# The gate CLAUDE.md calls `just wire-test`: tests, clippy with the deny set,
# cargo-deny, and the committed C header must match a fresh cbindgen run.
wire-test:
  extends: .wire
  stage: wire
  # every canon push as merged, beside the wire changes .wire runs on
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "canon"
    - changes:
        paths: [skymp-wire/**/*]
        compare_to: refs/heads/canon
  script:
    - cargo test --workspace --all-features
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    - ../ci/net-retry.sh cargo deny check
    - (cd crates/wire-client-ffi && cbindgen --config cbindgen.toml --crate wire-client-ffi --output /tmp/skymp_wire.h && diff -u include/skymp_wire.h /tmp/skymp_wire.h)

# A Linux difftest binary plus the session files, for sky-srv: `just test-proto`
# runs it inside the server image next to the fakeclient (docs/WIRE.md, Track W
# step 8). Also runs when only this file changes, so the artifact exists before
# the next wire change; the Rust image is then already on sky-ci.
difftest-build:
  extends: .wire
  stage: wire
  needs: [{ job: rust-image, optional: true }]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "canon"
      changes: [skymp-wire/**/*, .gitlab-ci.yml]
    - changes:
        paths: [skymp-wire/**/*, .gitlab-ci.yml]
        compare_to: refs/heads/canon
  script:
    - cargo build --release -p difftest
    - mkdir -p ../difftest-dist && cp target/release/difftest ../difftest-dist/ && cp -r difftest/sessions ../difftest-dist/
  artifacts:
    name: difftest-$CI_COMMIT_SHORT_SHA
    paths: [difftest-dist/]
    expire_in: 30 days

# Bounded fuzzing per push, FUZZ_SECONDS a target. One job builds the targets
# once and runs them one after another, so the job holds one target's memory
# at a time: side by side the four held about 2.1 GB resident at once (each
# 0.4 to 0.7 GB in two minutes), a third of sky-ci's VM, beside a server
# build's unit tests. libFuzzer's -rss_limit_mb is no cap for that: a target
# past it stops and reports an out-of-memory crash. The cost is time: four
# FUZZ_SECONDS in a row where side by side took one. The job prints each
# target's last resident set (libFuzzer's rss) and its cgroup's memory.peak,
# which counts the page cache and the build too. A crash leaves its input
# under fuzz/artifacts and that target's log as job artifacts.
wire-fuzz:
  extends: .wire
  stage: wire
  variables:
    FUZZ_TARGETS: "codec_decode validate transport_ingest json_recognize"
  script:
    - cargo +nightly fuzz build
    - |
      rc=0
      for t in $FUZZ_TARGETS; do
        cargo +nightly fuzz run "$t" -- -max_total_time="$FUZZ_SECONDS" > "fuzz-$t.log" 2>&1 || rc=1
        echo "== $t"; tail -n 6 "fuzz-$t.log"
        # libFuzzer's own last status line names the target's resident set, which grows as it runs
        echo "wire-fuzz: $t's last resident set: $(grep -o 'rss: [0-9]*Mb' "fuzz-$t.log" | tail -n 1)"
      done
      if [ -r /sys/fs/cgroup/memory.peak ]; then
        echo "wire-fuzz: the job's cgroup peak $(( $(cat /sys/fs/cgroup/memory.peak) / 1048576 )) MB (memory.peak: its processes and the page cache it filled, the build's included)"
      fi
      exit $rc
  artifacts:
    when: on_failure
    paths: [skymp-wire/fuzz/artifacts/, skymp-wire/fuzz-*.log]
    expire_in: 1 month

# C++ server, the upstream way, inside one docker build: ci/server.Dockerfile
# starts from upstream's published skymp-vcpkg-deps image (tag pinned from
# misc/github_env_linux) so nothing of vcpkg is rebuilt. T0 runs inside the
# build when the master .esm files are present; without them the build says
# so and skips ctest. Runs on merge requests, parity pushes outside
# skymp-wire, every canon push (each merge judged as merged), the schedule, a
# milestone branch's pipeline started by the API, by hand or by a trigger, and
# a milestone branch's push that changes, against canon, a file the build reads.
# needs: [] because the build uses nothing an earlier job makes (it builds the
# wire inside its own docker build), so a cancelled or failed wire job no
# longer skips it; the sky tag's one-job lane still runs it after or before
# the wire jobs, never beside them.
server-build:
  stage: server
  needs: []
  tags: [sky]
  image: docker:27
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "canon"
    - if: $CI_COMMIT_BRANCH == "parity"
      changes:
        - "**/*"
        - "!skymp-wire/**/*"
    - if: $CI_COMMIT_BRANCH =~ /^m[0-9]+-/ && $CI_PIPELINE_SOURCE =~ /^(api|web|trigger)$/
    # A milestone branch's push builds the server (with the wire) when the branch changes, against canon, a file the
    # image or its ctest reads: the server and the libraries it links (papyrus-vm, libespm, savefile, serialization,
    # viet, skymp-wire), the compiled Papyrus scripts it ships (skymp5-scripts), the unit tests and what they read
    # from outside unit/ (.clang-format among their sources, unit/CMakeLists.txt's TEMPLATE_ESS_PATH, the three
    # Skyrim Platform headers unit/ includes; lab/tools/fork-lint.sh checks the list against unit/),
    # every project's CMake files (the configure reads them all), vcpkg and its ports, the build's own scripts and
    # Dockerfile, the deps image's pin (misc/), and this file. The Linux build also compiles the client and Skyrim
    # Platform, which client-build builds too; only build/dist/server goes into the image. compare_to keeps a new
    # branch's first push from counting every file as changed.
    - if: $CI_COMMIT_BRANCH =~ /^m[0-9]+-/
      changes:
        paths:
          - .gitlab-ci.yml
          - .gitmodules
          - .dockerignore
          - .clang-format
          - vcpkg
          - vcpkg.json
          - overlay_ports/**/*
          - overlay_triplets/**/*
          - "**/CMakeLists.txt"
          - "**/*.cmake"
          - cmake/**/*
          - build.sh
          - ci/server.Dockerfile
          - ci/net-retry.sh
          - ci/net-failures.txt
          - misc/**/*
          - skymp5-server/**/*
          - skymp-wire/**/*
          - papyrus-vm/**/*
          - libespm/**/*
          - savefile/**/*
          - serialization/**/*
          - viet/**/*
          - skymp5-scripts/**/*
          - unit/**/*
          - skyrim-platform/src/platform_se/skyrim_platform/assets/template.ess
          - skyrim-platform/src/platform_se/skyrim_platform/PlatformCall.h
          - skyrim-platform/src/platform_se/skyrim_platform/HookPairing.h
          - skyrim-platform/src/platform_se/skyrim_platform/HandOff.h
          - skyrim-platform/src/platform_se/skyrim_platform/PushRoute.h
          - skyrim-platform/src/platform_se/skyrim_platform/ActRoute.h
          - skyrim-platform/src/platform_se/skyrim_platform/OwnedObject.h
          - skyrim-platform/src/platform_se/skyrim_platform/FigureNoise.h
          - skyrim-platform/src/platform_se/skyrim_platform/PuppetDetection.h
        compare_to: refs/heads/canon
  script:
    - |
      if [ -n "${SKYRIM_DATA_URL:-}" ]; then
        mkdir -p skyrim_data_files
        for f in Skyrim.esm Update.esm Dawnguard.esm HearthFires.esm Dragonborn.esm; do
          if ! wget -q -O "skyrim_data_files/$f" "$SKYRIM_DATA_URL/$f"; then
            echo "$f not available at SKYRIM_DATA_URL: building without master files, ctest will be skipped"
            rm -rf skyrim_data_files
            break
          fi
        done
      else
        echo "SKYRIM_DATA_URL unset: building without master files, ctest will be skipped"
      fi
    - VCPKG_URL=$(git config -f .gitmodules submodule.vcpkg.url)
    - VCPKG_COMMIT=$(git ls-tree HEAD vcpkg | awk '{print $3}')
    - echo "vcpkg $VCPKG_URL @ $VCPKG_COMMIT"
    # Tagged by branch: parity is what sky-srv's compose runs; a port branch
    # (m1-wire) ships beside it as skymp-server:m1-wire and never replaces it.
    - TAG="$CI_COMMIT_REF_SLUG"
    - ci/net-retry.sh docker build -f ci/server.Dockerfile --build-arg "VCPKG_URL=$VCPKG_URL" --build-arg "VCPKG_COMMIT=$VCPKG_COMMIT" -t "skymp-server:$TAG-$CI_COMMIT_SHORT_SHA" .
    - docker tag "skymp-server:$TAG-$CI_COMMIT_SHORT_SHA" "skymp-server:$TAG"
    # Ship to the sky-ci registry sky-srv pulls from (10.10.70.12:5000).
    - docker tag "skymp-server:$TAG-$CI_COMMIT_SHORT_SHA" "localhost:5000/skymp-server:$TAG-$CI_COMMIT_SHORT_SHA"
    - docker tag "skymp-server:$TAG-$CI_COMMIT_SHORT_SHA" "localhost:5000/skymp-server:$TAG"
    - docker push "localhost:5000/skymp-server:$TAG-$CI_COMMIT_SHORT_SHA"
    - docker push "localhost:5000/skymp-server:$TAG"

# The Windows client and Skyrim Platform build (thuum, 2026-10-05): the `dist`
# the lab clients run, built on sky-build (VM 720, tag `windows`, a shell
# runner with pwsh) the way upstream's .github/actions/pr_base does it, so
# client builds leave GitHub Actions and join this pipeline. Off until the
# runner exists: set the project variable CLIENT_BUILD_WINDOWS to 1. vcpkg
# keeps its binary cache on the VM's own D: (no NuGet feed). The master files
# come from our own copies (SKYRIM_DATA_URL), never from upstream's public
# download (cmake/download_skyrim_data.cmake), so DOWNLOAD_SKYRIM_DATA stays
# off and UNIT_DATA_DIR points at the fetched files. The generator is pinned:
# CMakeLists.txt accepts only Visual Studio 17 2022, and cmake's default is
# the newest Visual Studio on the machine. needs: [] because the build uses
# nothing an earlier job makes (it builds the wire's client library from the
# tree), so a cancelled or failed wire job no longer skips it.
client-build:
  stage: server
  needs: []
  tags: [windows]
  # a cold vcpkg build of the client's 59 ports on sky-build's 8 cores will not fit the project's hour (the
  # first run, job 8859, was on port 13 of 59 at 49 min when it failed with no_updates_running, the runner's
  # reporting stopping, not this timeout); warm runs hit D:/vcpkg-bincache and take minutes
  timeout: 4h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: "1"
    VCPKG_BINARY_SOURCES: "clear;files,D:/vcpkg-bincache,readwrite"
    VCPKG_FEATURE_FLAGS: "manifests"
  # A branch's push builds the client only when the branch changes, against canon, a file the build reads: the
  # client, Skyrim Platform and client-deps, the libraries the platform links (papyrus-vm, savefile, viet,
  # serialization), skymp-wire (skyrim-platform depends on MpClientPlugin.dll, wire-client-ffi's cdylib), every
  # project's CMake files (the configure reads them all), vcpkg and its ports, and this file. compare_to keeps a
  # new branch's first push from counting every file as changed. A pipeline started by hand or by the API builds
  # the client whatever it changes.
  rules:
    - if: $CLIENT_BUILD_WINDOWS != "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "parity"
    - if: $CI_COMMIT_BRANCH =~ /^m[0-9]+-/ && $CI_PIPELINE_SOURCE =~ /^(api|web|trigger)$/
    - if: $CI_COMMIT_BRANCH =~ /^m[0-9]+-/
      changes:
        paths:
          - .gitlab-ci.yml
          - .gitmodules
          - vcpkg
          - vcpkg.json
          - overlay_ports/**/*
          - overlay_triplets/**/*
          - "**/CMakeLists.txt"
          - "**/*.cmake"
          - cmake/**/*
          - skymp5-client/**/*
          - skyrim-platform/**/*
          - client-deps/**/*
          - skymp-wire/**/*
          - papyrus-vm/**/*
          - savefile/**/*
          - viet/**/*
          - serialization/**/*
        compare_to: refs/heads/canon
  script:
    - New-Item -ItemType Directory -Force D:/vcpkg-bincache, skyrim_data_files | Out-Null
    # ci/net-retry.ps1's own exits (ci/net-retry.test.ps1), on the host its wrapped step runs on
    - '& ci/net-retry.test.ps1; if ($LASTEXITCODE) { exit 1 }'
    - |
      foreach ($f in 'Skyrim.esm', 'Update.esm', 'Dawnguard.esm', 'HearthFires.esm', 'Dragonborn.esm') {
        Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 5 -RetryIntervalSec 10 -Uri "$env:SKYRIM_DATA_URL/$f" -OutFile "skyrim_data_files/$f"
      }
    - Push-Location skymp5-client; yarn --frozen-lockfile; if ($LASTEXITCODE) { exit 1 }; yarn build; if ($LASTEXITCODE) { exit 1 }; yarn test; if ($LASTEXITCODE) { exit 1 }; Pop-Location
    - '& ci/net-retry.ps1 .\vcpkg\bootstrap-vcpkg.bat -disableMetrics; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
    - |
      cmake -B build -G "Visual Studio 17 2022" -A x64 "-DVCPKG_ROOT=$PWD/vcpkg" -DUNIT_DATA_DIR=skyrim_data_files -DDOWNLOAD_SKYRIM_DATA=OFF `
        -DBUILD_NODEJS=OFF -DBUILD_FRONT=OFF -DPREPARE_NEXUS_ARCHIVES=OFF -DCMAKE_BUILD_TYPE=Release `
        -DSKYRIM_VR=OFF -DCPPCOV_PATH=OFF
      if ($LASTEXITCODE) { exit 1 }
    # the client's own targets, all of build/dist/client: Skyrim Platform (its libraries and their copy into the
    # dist), client-deps' files and the client bundle; the server and its unit tests are server-build's, on Linux
    - cmake --build build --config Release --target skyrim-platform client-deps skymp5-client; if ($LASTEXITCODE) { exit 1 }
  artifacts:
    name: dist
    paths: [build/dist]
    expire_in: 14 days
