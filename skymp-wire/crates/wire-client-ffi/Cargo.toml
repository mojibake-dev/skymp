[package]
name = "wire-client-ffi"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The client half of the wire: MpClientPlugin.dll's seven C exports over renet, with its own network thread (ADR-019). unsafe allowed here, reviewed."

[lib]
# The cdylib ships as Data/SKSE/Plugins/MpClientPlugin.dll (Skyrim Platform
# loads it by that path); the rlib is what the Rust fakeclient links, so T2
# runs the same client code the game does.
name = "skymp_wire"
crate-type = ["cdylib", "rlib"]

[dependencies]
wire-schema = { path = "../wire-schema" }
wire-json = { path = "../wire-json" }
wire-validate = { path = "../wire-validate" }
wire-transport = { path = "../wire-transport" }

[lints.rust]
unsafe_code = "allow"   # FFI crate. Every unsafe block carries a SAFETY comment.
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
