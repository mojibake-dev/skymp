# skymp-wire workspace. Dependency majors are pinned per ADR-015; Cargo.lock
# holds the exact versions.
[workspace]
resolver = "2"
members = [
  "crates/wire-schema",
  "crates/wire-codec",
  "crates/wire-validate",
  "crates/wire-transport",
  "crates/wire-bridge",
  "crates/wire-client-ffi",
  "difftest",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
publish = false   # path dependencies inside the workspace; nothing here goes to crates.io
license = "MIT"   # standalone crates only; combined works follow the subproject they link into (ADR-014)
rust-version = "1.88"   # cxx 1.0.202 needs it

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["heapless", "experimental-derive"] }  # heapless feature: MaxSize impls for heapless types (ADR-015)
heapless = { version = "0.7", features = ["serde"] }  # 0.7 is the version postcard 1.1 binds to (ADR-015)
thiserror = "2"
renet = "2"
renet_netcode = "2"
cxx = "1"
proptest = "1"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# These lints are the rules in .claude/rules/rust.md made mechanical.
[workspace.lints.rust]
unsafe_code = "forbid"          # overridden to "allow" only in wire-bridge and wire-client-ffi
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"

[profile.release]
overflow-checks = true
debug = 1
