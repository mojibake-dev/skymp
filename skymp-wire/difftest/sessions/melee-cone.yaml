# difftest melee-cone (M1 validation, thuum docs/verbs/hit-cone.md): c1 and
# c2 are new characters (profiles 9 and 10, actors 0xff000002 and
# 0xff000003: see melee-reach). c1 stays at the spawn facing its start
# angle, 72 degrees (server-settings startPoints); c2 steps 100 units to
# c1's back, bearing 252, within reach but 180 degrees off c1's heading.
# c1 then sends a bare-handed hit on it. The legacy server takes the hit;
# the fixed one refuses it (outside 95 degrees for a Nord, 80 without
# race data), so the health c2 is told differs.
id: melee-cone
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 3500, send: {t: 17, data: {aggressor: 20, target: 4278190083, source: 500, isBashAttack: false, isHitBlocked: false, isPowerAttack: false, isSneakAttack: false, projectile: 0}}}
  - {client: c2, at_ms: 0, move: {dx: -95.1, dy: -30.9}}
  - {client: c2, at_ms: 3500, move: {dx: -95.1, dy: -30.9}}
divergences:
  - client: c2
    msg: {t: 16, data: {health: 0.96288001537323}}
    legacy: 1
    wire: 0
    reason: the legacy server took a hit on a player behind its attacker (3.7 percent of c2's health); the fixed one refused it outside the cone
  - client: c2
    msg: {t: 25, idx: 2}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
