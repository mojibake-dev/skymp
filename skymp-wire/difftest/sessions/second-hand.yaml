# difftest second-hand (M2, thuum docs/verbs/second-hand.md): c1 and c2 are
# new characters (profiles 9 and 10, actors 0xff000002 and 0xff000003: see
# melee-reach), c2 50 units off the spawn. At 1.5 s c1 learns Flame Cloak
# (Skyrim.esm FlameCloakLeftHand 0xDE511, 910609, fire-and-forget, Self,
# 60 s; the console's addspell, as teleports.yaml teaches its spell) and
# wears it in its right hand at 2 s. At 2.5 s c1 reports a hit on c2 by the
# cloak's applied spell (FlameCloakDmg 0x2B385, 177029, concentration, 8 a
# second; the Cloak effect FireCloakFFSelf 0x3AE9E names it as its
# associated item, thuum lab/esm.py on sky-srv 2026-10-17) with no cloak
# cast: both servers drop it. At 3 s c1 casts the cloak (SpellCast,
# castingSource 1; the cast carries m2-spell-launch's launch fields, zero,
# which parity's schema ignores). Its proc hits at 3.4 s and 3.8 s are
# dropped by the legacy server (a spell c1 never held) and claimed by the
# fixed one against the cloak's cast: the first counts one cadence (500 ms,
# 4 of FlameCloakDmg's 8 a second), the next the 400 ms since it (about 3.2, moved by the claim's timing). c2 steps
# again at 4 s of its own (5.5 s of c1's), so it outlives c1, as in every
# session. The divergences beyond the departure line are declared from the
# session's first T2 run.
# Since train-27 (thuum ADR-039, docs/research/apocalypse/effect-conditions.md)
# the cloak's damage effect is judged by its own IsHostileToActor condition:
# with no fight between c1 and c2 the claimed procs' effect is refused, c2's
# health does not move, and a hit whose every effect is refused begins no
# fight, so both stacks agree on the health and on the absence of
# StartCombat (T2 20261019-0000 on c32cf0bd showed the old declarations no
# longer occurring). The claim itself is SecondHandTest's, with a fight
# first.
id: second-hand
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 1500, send: {t: 12, data: {t: 12, commandName: addspell, args: [20, 910609]}}}
  - {client: c1, at_ms: 2000, send: {t: 5, idx: "{{idx}}", data: {inv: {entries: []}, rightSpell: 910609, numChanges: 1}}}
  - {client: c1, at_ms: 2500, send: {t: 17, data: {aggressor: 20, target: 4278190083, source: 177029, isBashAttack: false, isHitBlocked: false, isPowerAttack: false, isSneakAttack: false, projectile: 0}}}
  - {client: c1, at_ms: 3000, send: {t: 23, data: {caster: 20, target: 0, spell: 910609, isDualCasting: false, interruptCast: false, castingSource: 1, aimAngle: 0, aimHeading: 0, hasLaunch: false, originX: 0, originY: 0, originZ: 0, launchAngleX: 0, launchAngleZ: 0, actorAnimationVariables: {booleans: [], floats: [], integers: []}}}}
  - {client: c1, at_ms: 3400, send: {t: 17, data: {aggressor: 20, target: 4278190083, source: 177029, isBashAttack: false, isHitBlocked: false, isPowerAttack: false, isSneakAttack: false, projectile: 0}}}
  - {client: c1, at_ms: 3800, send: {t: 17, data: {aggressor: 20, target: 4278190083, source: 177029, isBashAttack: false, isHitBlocked: false, isPowerAttack: false, isSneakAttack: false, projectile: 0}}}
  - {client: c2, at_ms: 0, move: {dx: 50}}
  - {client: c2, at_ms: 4000, move: {dx: 60}}
divergences:
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
  - client: c1
    msg: {t: 41, text: "addspell done: de511 recorded", refused: false}
    legacy: 0
    wire: 1
    reason: an owner's AddSpell writes the server's record of learned spells and answers with a line (thuum docs/verbs/second-hand.md teaches the cloak as teleports.yaml teaches its spell); the legacy server does not know the command
  - client: c1
    msg: {t: 30, class: Actor, function: AddSpell, arguments: [{formId: 910609, type: Spell}, false]}
    legacy: 0
    wire: 1
    reason: the recorded spell is told to c1's own game
  - client: c1
    msg: {t: 30, class: Actor, function: RemoveSpell, arguments: [{formId: 910609, type: Spell}]}
    legacy: 1
    wire: 0
    reason: the legacy stack refuses a spell c1 never learned and takes it from c1's game (upstream #2665)
  - client: c1
    msg: {t: 28, inventory: {entries: [{baseId: 10, count: 10}, {baseId: 15, count: 140}, {baseId: 77382, count: 1}, {baseId: 77385, count: 1}, {baseId: 77387, count: 1}, {baseId: 77389, count: 1}, {baseId: 77494, count: 1}, {baseId: 77495, count: 1}, {baseId: 79760, count: 1}, {baseId: 80253, count: 23}, {baseId: 80254, count: 1}, {baseId: 120044, count: 2}, {baseId: 236362, count: 2}, {baseId: 243042, count: 1}, {baseId: 256733, count: 5}, {baseId: 256736, count: 5}, {baseId: 256741, count: 5}, {baseId: 256810, count: 1}, {baseId: 256819, count: 1}, {baseId: 1017598, count: 1}]}}
    legacy: 1
    wire: 0
    reason: the legacy stack's refusal of the spell sends c1 its inventory again (upstream #2665)
  - client: c1
    msg: {t: 5, data: {rightSpell: 910609}}
    legacy: 0
    wire: 1
    reason: the wire stack takes the learned cloak in the right hand and relays it, c1's own game included (it listens to itself); the legacy stack refuses it
  - client: c2
    msg: {t: 5, data: {rightSpell: 910609}}
    legacy: 0
    wire: 1
    reason: the same relay reaches c2
  - client: c2
    msg: {t: 23, data: {caster: 4278190082, castingSource: 1, spell: 910609}}
    legacy: 0
    wire: 1
    reason: the wire stack relays c1's accepted cloak cast to c2, naming c1 as the server knows it; the legacy stack refuses a cast of a spell c1 never learned
