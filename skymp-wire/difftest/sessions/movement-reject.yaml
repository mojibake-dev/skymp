# difftest movement-reject (M1 validation, thuum docs/verbs/validation.md,
# Movement; ADR-079 decision 7, tracker #191): c1 sends one move the legacy
# server rejects, a jump of 5000 units (MovementValidation took under 4096 per
# message), and the legacy stack snaps c1 back with Teleport2. The fixed
# server records a player's own jump (Eli, 2026-11-20: the server never sends
# a player back for a move its own game made to another cell or by a jump):
# no Teleport2, the move relayed as the legacy server relayed it, c1 itself
# included, and c2 told to place c1's figure there (ActorJump) instead of
# gliding it. UpdateMovement compares exactly here (not as presence), so the
# relayed jump counts on both stacks. The forms that leave and enter c1's
# view at 5000 units east are the fixed stack's alone now (the legacy stack
# sends c1 back): eleven leave it and twenty-three enter it, read from the
# first T2 of tracker #191 (m4-191-move be9ecc58, 2026-11-20).
#
# Timing (DIFFTEST_CLIENT_GAP_MS 1500): c2 joins before c1's jump and moves
# once more after it, and c1 leaves first, so c2 also sees c1's departure the
# way smoke declares it.
id: movement-reject
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
volatile: [3, 24]
steps:
  - {client: c1, at_ms: 3000, move: {dx: 5000}}
  - {client: c2, at_ms: 0, move: {dy: 30}}
  - {client: c2, at_ms: 2500, move: {dy: 60}}
divergences:
  - client: c1
    msg: {t: 31}
    legacy: 1
    wire: 0
    reason: the legacy server sends the jump back (Teleport2); the fixed server records a player's own jump (ADR-079 decision 7)
  - client: c1
    msg: {t: 25}
    legacy: 0
    wire: 11
    reason: on the fixed server c1 stands 5000 units east after its recorded jump and eleven forms near the spawn leave its view; the legacy server sent c1 back
