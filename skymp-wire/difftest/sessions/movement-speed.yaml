# difftest movement-speed (M1 validation, thuum docs/verbs/movement-speed.md;
# ADR-079 decision 7, tracker #191): c1 sends five moves of 800 units each,
# 50 ms apart (16000 units a second; each under 4096). The legacy server takes
# and relays all five. The fixed server charges each move to c1's ground
# speed budget (2048 units, refilled at 660 a second): the first two fit, the
# third does not (448 left plus a few ms of refill), and neither do the two
# after it. Since decision 7 (Eli, 2026-11-20: a player's own move is never
# sent back) the fixed server takes those three too, logs the disagreement
# (E_MOVE_SPEED, once and at each power of two) and tells c2 to place c1's
# figure at each (ActorJump) instead of gliding it. So both stacks take and
# relay all five and c1 reaches 4000 units north on both, the forms near the
# spawn leaving its view the same way (2026-10-03's nineteen); the three
# placements are the fixed server's alone. UpdateMovement compares exactly
# here (not as presence).
#
# Timing (DIFFTEST_CLIENT_GAP_MS 1500) as movement-reject: c2 joins before
# c1's moves and outlives c1, so c2 also sees c1's departure the way smoke
# declares it.
id: movement-speed
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
volatile: [3, 24]
steps:
  - {client: c1, at_ms: 3000, move: {dy: 800}}
  - {client: c1, at_ms: 3050, move: {dy: 1600}}
  - {client: c1, at_ms: 3100, move: {dy: 2400}}
  - {client: c1, at_ms: 3150, move: {dy: 3200}}
  - {client: c1, at_ms: 3200, move: {dy: 4000}}
  - {client: c2, at_ms: 0, move: {dx: 30}}
  - {client: c2, at_ms: 2500, move: {dx: 60}}
divergences:
  - client: c2
    msg: {t: 46}
    legacy: 0
    wire: 3
    reason: the three moves beyond c1's ground speed budget, taken on both stacks since ADR-079 decision 7, placed for the neighbour by the fixed server (ActorJump)
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
