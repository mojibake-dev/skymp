# skymp-wire workspace. Dependency majors are pinned per ADR-015; Cargo.lock
# holds the exact versions.
[workspace]
resolver = "2"
members = [
  "crates/wire-schema",
  "crates/wire-json",
  "crates/wire-legacy",
  "crates/wire-codec",
  "crates/wire-validate",
  "crates/wire-rules",
  "crates/wire-transport",
  "crates/wire-bridge",
  "crates/wire-client-ffi",
  "crates/wire-fakeclient",
  "difftest",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
publish = false   # path dependencies inside the workspace; nothing here goes to crates.io
license = "MIT"   # standalone crates only; combined works follow the subproject they link into (ADR-014)
rust-version = "1.88"   # cxx 1.0.202 needs it

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }  # alloc: bounded types are heap backed (ADR-019)
postcard = { version = "1.1", default-features = false, features = ["alloc"] }  # alloc: to_allocvec for heap-backed bounded types (ADR-019)
thiserror = "2"
renet = "2"
renet_netcode = "2"
cxx = "1"
proptest = "1"
arbitrary = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # parse floats correctly rounded, as JSON.parse and simdjson do (found by fuzz/validate)
serde_yaml = "0.9"

# These lints are the rules in .claude/rules/rust.md made mechanical.
[workspace.lints.rust]
unsafe_code = "forbid"          # overridden to "allow" only in wire-bridge and wire-client-ffi
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"

[profile.release]
overflow-checks = true
debug = 1
