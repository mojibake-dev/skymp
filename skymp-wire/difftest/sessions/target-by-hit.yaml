# difftest target-by-hit (M2 train-27, thuum docs/verbs/spell-cast.md, the
# target by first hit): c1 and c2 are new characters (profiles 9 and 10,
# actors 0xff000002 and 0xff000003: see melee-reach), c2 50 units off the
# spawn. At 1.5 s c1 learns dunHonningbrewSkeeverPoison (Skyrim.esm
# 0x10FC22, 1113122: one effect delivered by touch, fire-and-forget; lab/esm.py
# on sky-srv 2026-10-18, landing-spells) and holds it in its right hand at
# 2 s. At 3 s c1 casts it with target 0, as a caster's game does when its
# crosshair found nobody (playtest twenty-three: every Shadowbond and Azure
# Reconstruction cast). The legacy server relays the cast to c2 at once, with
# target 0; the fixed one holds it (a spell delivered to its target waits for
# its first hit) and relays it at 3.4 s, when c1's hit on c2 names the
# target, with c2's id. Both count the hit the same (the skeever bite's
# effects on c2 from the records). c2 steps again at 4 s of its own, so it
# outlives c1, as in every session.
id: target-by-hit
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 1500, send: {t: 12, data: {t: 12, commandName: addspell, args: [20, 1113122]}}}
  - {client: c1, at_ms: 2000, send: {t: 5, idx: "{{idx}}", data: {inv: {entries: []}, rightSpell: 1113122, numChanges: 1}}}
  - {client: c1, at_ms: 3000, send: {t: 23, data: {caster: 20, target: 0, spell: 1113122, isDualCasting: false, interruptCast: false, castingSource: 1, aimAngle: 0, aimHeading: 0, hasLaunch: false, originX: 0, originY: 0, originZ: 0, launchAngleX: 0, launchAngleZ: 0, actorAnimationVariables: {booleans: [], floats: [], integers: []}}}}
  - {client: c1, at_ms: 3400, send: {t: 17, data: {aggressor: 20, target: 4278190083, source: 1113122, isBashAttack: false, isHitBlocked: false, isPowerAttack: false, isSneakAttack: false, projectile: 0}}}
  - {client: c2, at_ms: 0, move: {dx: 50}}
  - {client: c2, at_ms: 4000, move: {dx: 60}}
divergences:
  - client: c2
    msg: {t: 23, data: {target: 0}}
    legacy: 1
    wire: 0
    reason: the legacy server relays a cast delivered to its target at once, with the caster's guess of 0
  - client: c2
    msg: {t: 23, data: {target: 4278190083}}
    legacy: 0
    wire: 1
    reason: the fixed server relays it at its first hit, with the target the hit names
  - client: c2
    msg: {t: 25, idx: 2}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
