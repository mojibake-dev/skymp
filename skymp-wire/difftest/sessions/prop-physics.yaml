# thuum docs/verbs/prop-physics.md (ADR-058): one simulating seat per physics prop. c1 and
# c2 are new characters (profiles 9 and 10), so their actors are 0xff000002 and 0xff000003
# (melee-reach's note: the clean world holds two characters, ids start at 0xff000000). The
# T2 spawn (startPoints: 133857, -61130, 14662 in Tamriel) has no item placement within
# 2500 units (lab/esm.py near, 2026-10-29), so the prop is a drop: at 600 ms c1 gives itself
# an iron dagger (0x1397e, 80254) through the console (AddItem, answered with a line as
# smoke declares), at 1200 ms drops it (DropItem, both stacks place the reference at the
# generator's next id and tell both clients CreateActor alike). At 2000 ms c1
# claims the drop (PropClaim touch 2): the wire stack grants it (c1 is a listener of its
# drop, placed 64 units ahead in its grid square; the claimant's cell is no gate since
# physics rung 1, A1 to A7 of ADR-071 decision 2) at epoch 1 and tells every listener of
# the prop, c1 and c2 (PropOwner); the legacy stack knows no MsgType 59. At 2500 ms c1
# sends an awake sample and at 3500 ms the sleep: the wire stack writes the record and
# relays each to c2 alone (the two PropTransform divergences), and the sleep returns the
# prop to the cell's host by default (A4: every return is a word; nobody hosts the cell
# here), so both clients hear a PropOwner with player 0 at epoch 2 (SCHEMA_VERSION 45);
# the legacy stack knows no MsgType 58. Between the two, at 1250 ms of its own (about
# 2750 ms of c1's, 750 ms inside either end of c1's live row; the sleep stood at 3000 ms
# before this row), c2 picks the dagger up (Activate, the activation a refused grab ends
# in, thuum docs/engine/havok-props.md E16): the wire stack refuses it E_PROP_MOVING (a
# pickup is a take, ADR-071 decision 2's table, and c1 streams the drop awake) and
# answers c2 with the standing word, c1's at epoch 1, so c2 hears that word twice and
# nothing of a pickup (no isHarvested, no inventory, no destroy), and the sleep's words
# follow as before. The legacy stack's C++ fakeclient resolves no "{{created:80254}}"
# (the placeholder is the Rust fakeclient's, 05184f99), so the Activate it sends carries
# a string where its server reads a number, and nothing follows there. c1's departure
# sends no word: its row returned at rest. If the drop's id were assumed and wrong on
# a run (something else drew an id first: in a full T2 the sessions before this one allocate
# forms on the same server, and P3's first T2 read exactly that, 2026-10-29), nothing here
# assumes it: the sends and the declarations name the drop as "{{created:80254}}", which the
# fakeclient resolves to the id the CreateActor it received for that base carried, and the
# harness resolves the same way per stack before matching. c2 steps again
# at 5 s of its own, so it outlives c1, as in every session.
id: prop-physics
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 0, move: {dx: 10}}
  - {client: c1, at_ms: 600, send: {t: 12, data: {commandName: AddItem, args: [20, 80254, 1]}}}
  - {client: c1, at_ms: 1200, send: {t: 19, baseId: 80254, count: 1}, reliable: true}
  - {client: c1, at_ms: 2000, send: {t: 59, refr: "{{created:80254}}", touch: 2}, reliable: true}
  - {client: c1, at_ms: 2500, send: {t: 58, refr: "{{created:80254}}", pos: [133900.0, -61100.0, 14662.0], rot: [0.0, 0.0, 72.0], asleep: false}, reliable: false}
  - {client: c1, at_ms: 3500, send: {t: 58, refr: "{{created:80254}}", pos: [133910.0, -61090.0, 14650.0], rot: [0.0, 0.0, 80.0], asleep: true}, reliable: true}
  - {client: c2, at_ms: 0, move: {dx: 50}}
  - {client: c2, at_ms: 1250, send: {t: 6, data: {caster: 20, target: "{{created:80254}}", isSecondActivation: false}}, reliable: true}
  - {client: c2, at_ms: 5000, move: {dx: 60}}
divergences:
  # the drop's copy: the legacy server creates it at the dropper's own position and the branch at the
  # drop point, 64 units ahead along the dropper's heading (72 degrees: +60.868, +19.777) and 48 up
  # (MpActor::DropItem through PapyrusObjectReference::PlaceAt, m3-prop-physics 967ba8c8; thuum
  # docs/verbs/prop-physics.md, D75: the create word carries the position the clients spawn at, so the
  # copy never spawns inside the dropper's capsule). The numbers are the harness's printed f32 values.
  - client: c1
    msg: {t: 33, baseId: 80254, transform: {pos: [133867, -61130, 14662]}}
    legacy: 1
    wire: 0
    reason: the dropped copy's create word at the dropper's position (the legacy server's PlaceAtMe); the branch creates it at the drop point (967ba8c8, thuum docs/verbs/prop-physics.md)
  - client: c1
    msg: {t: 33, baseId: 80254, transform: {pos: [133927.875, -61110.22265625, 14710]}}
    legacy: 0
    wire: 1
    reason: the dropped copy's create word at the drop point, 64 ahead along the dropper's heading of 72 degrees and 48 up (967ba8c8, D75); the legacy server places it at the dropper
  - client: c2
    msg: {t: 33, baseId: 80254, transform: {pos: [133867, -61130, 14662]}}
    legacy: 1
    wire: 0
    reason: the same create word to the drop's other listener, at the dropper's position on the legacy server
  - client: c2
    msg: {t: 33, baseId: 80254, transform: {pos: [133927.875, -61110.22265625, 14710]}}
    legacy: 0
    wire: 1
    reason: the same create word to the drop's other listener, at the drop point on the branch (967ba8c8, D75)
  - client: c1
    msg: {t: 41, text: "AddItem done", refused: false}
    legacy: 0
    wire: 1
    reason: the server answers every console command with a line (ConsoleOutput); the legacy server prints nothing back
  - client: c1
    msg: {t: 60, refr: "{{created:80254}}", player: 0xff000002, epoch: 1}
    legacy: 0
    wire: 1
    reason: the owner word to the claimant, a listener of its own drop (PropOwner, thuum docs/verbs/prop-physics.md); the legacy server knows no such message
  - client: c2
    msg: {t: 60, refr: "{{created:80254}}", player: 0xff000002, epoch: 1}
    legacy: 0
    wire: 2
    reason: the owner word to the prop's other listener (PropOwner, thuum docs/verbs/prop-physics.md), at the grant and again as the answer to its pickup at 1250 ms of its own, refused E_PROP_MOVING (a pickup is a take, ADR-071 decision 2's table; AnswerPropWord repeats the standing word); the legacy server knows no such message, and its fakeclient's Activate names no number
  - client: c2
    msg: {t: 58, refr: "{{created:80254}}", asleep: false}
    legacy: 0
    wire: 1
    reason: the simulator's awake sample relayed to the cell's other listener (PropTransform, thuum docs/verbs/prop-physics.md); the legacy server drops the type
  - client: c2
    msg: {t: 58, refr: "{{created:80254}}", asleep: true}
    legacy: 0
    wire: 1
    reason: the simulator's sleep sample relayed reliable to the cell's other listener (PropTransform); the legacy server drops the type
  - client: c1
    msg: {t: 60, refr: "{{created:80254}}", player: 0, epoch: 2}
    legacy: 0
    wire: 1
    reason: the owner word at the body's rest (nobody hosts the cell in this session, so the asleep sample returns the prop to the host by default, player 0, at epoch 2; A4 of ADR-071 decision 2, physics rung 1); the legacy server knows no such message
  - client: c2
    msg: {t: 60, refr: "{{created:80254}}", player: 0, epoch: 2}
    legacy: 0
    wire: 1
    reason: the same return word to the prop's other listener; the legacy server knows no such message
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
