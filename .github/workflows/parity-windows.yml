# Fork-only: the Windows client and Skyrim Platform build, the lab's one source of
# a dist, for canon and every milestone branch (m<N>-...), reusing upstream's
# composite action, whose BUILD_TARGETS and RUN_TESTS inputs keep upstream's
# whole build and tests by default. Upstream's own pr-windows-flatrim.yml
# watches main; this file is the same job pointed at the fork's branches,
# building the client's targets alone (Skyrim Platform, client-deps, the client
# bundle: all of dist/client) and running the client's own tests (skymp5-client's
# yarn test) with no ctest: the server and its unit tests are built and run by
# the fork's GitLab server-build. GitHub's runners build it so that no Windows
# build shares a host with the lab's games. The lab takes the run of a commit by
# its head sha (thuum's lab/tools/client-builds.py), and starts one by dispatch
# for a branch head no push built. Nothing here is meant for upstream.
#
# vcpkg binary cache: pr_base points the "GitHub" NuGet source at upstream's
# feed (skyrim-multiplayer), which this fork's token can read but not write,
# and the fork's patched CommonLibSSE-NG port is never in it, so every run
# rebuilt that port (about 10 minutes). Packages this workflow builds go to a
# files cache (https://learn.microsoft.com/vcpkg/reference/binarycaching)
# kept between runs by actions/cache; upstream's feed stays a read source.
# vcpkg keys every archive by its ABI hash (port files, triplet, compiler),
# so an old cache can only miss, never serve a wrong binary.
name: Parity Windows Flatrim (AE/SE)

on:
  push:
    # every push of canon or a milestone branch, whatever it changes, so each
    # head has its own dist. A newer push to the same branch supersedes a
    # running build (concurrency below); a dispatch while a push build runs
    # cancels it the same way
    branches: [ canon, 'm[0-9]+-*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: 'clear;files,C:/vcpkg-bincache,readwrite;nuget,GitHub,read'
  VCPKG_FEATURE_FLAGS: 'manifests'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'true'
      # The newest cache this branch (or the default branch) saved.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: C:/vcpkg-bincache
          key: vcpkg-bincache-windows-${{ github.run_id }}
          restore-keys: vcpkg-bincache-windows-
      - name: Count cached vcpkg packages
        id: vcpkg-cache-before
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/vcpkg-bincache | Out-Null
          $n = @(Get-ChildItem C:/vcpkg-bincache -Recurse -File -Filter *.zip).Count
          Write-Host "vcpkg binary cache: $n packages restored"
          "count=$n" >> $env:GITHUB_OUTPUT
      - uses: ./.github/actions/pr_base
        with:
          DESCRIPTION: 'Flatrim'
          SKYRIM_VR_FLAG: OFF
          SP_NEXUS_ARTIFACT_NAME: Skyrim Platform %SP_VERSION%
          DEPLOY_BRANCH: ""
          DIST_ARTIFACT_NAME: dist
          SERVER_DIST_ARTIFACT_NAME: server-dist
          SKYMP5_PATCHES_PAT: ${{ secrets.SKYMP5_PATCHES_PAT }}
          NUGET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TARGETS: "skyrim-platform client-deps skymp5-client"
          RUN_TESTS: "false"
      # the client's pure-function tests as merged; the skymp5-client target
      # above installed its packages (cmake/yarn.cmake)
      - name: Client tests (yarn test)
        shell: pwsh
        working-directory: skymp5-client
        run: |
          yarn test
          if ($LASTEXITCODE) { exit 1 }
      # vcpkg builds during configure, so a run that fails later (tests) still
      # has new packages worth keeping; a cancelled run may hold a partial one.
      - name: Count cached vcpkg packages after the build
        id: vcpkg-cache-after
        if: success() || failure()
        shell: pwsh
        run: |
          $n = @(Get-ChildItem C:/vcpkg-bincache -Recurse -File -Filter *.zip).Count
          Write-Host "vcpkg binary cache: $n packages after the build"
          "count=$n" >> $env:GITHUB_OUTPUT
      - name: Save the vcpkg binary cache
        if: (success() || failure()) && steps.vcpkg-cache-after.outputs.count != steps.vcpkg-cache-before.outputs.count
        uses: actions/cache/save@v6
        with:
          path: C:/vcpkg-bincache
          key: vcpkg-bincache-windows-${{ github.run_id }}
