# difftest script-call (thuum ADR-068, the one seam, rung 2; docs/verbs/
# papyrus-events.md): c1 and c2 are new characters (profiles 9 and 10, actors
# 0xff000002 and 0xff000003, see melee-reach), both at the spawn in Tamriel's
# exterior cell (32, -15), form 0xbbb1 (cell-host's read). At 1 s c1 reports
# the cell loaded and is granted it, HostGrant {cell 0xbbb1, epoch 1}, as in
# cell-host. Its game then reports two native calls a script made on the ore
# vein 0x10e6c5 (ACTI MineOreIron01_LFallForestDirt at (134931, -58398,
# 10752), inside that cell, enabled at start; Skyrim.esm by lab/esm.py,
# 2026-11-05: a world object the server loads with the spawn's chunk, no
# door, no container, no actor), late enough that c2, started 1.5 s after c1,
# stands logged in among the vein's listeners: at 3 s
# ObjectReference.PlayAnimation("Open"), relayed to c2 at once as SpSnippet
# ObjectReference.PlayAnimation on the vein with seq 1 (snippetIdx 0xFFFFFFFF,
# no answer); at 3.2 s the static Debug.SendAnimationEvent(vein, "Open"),
# selfId the vein, relayed with selfId 0, its arguments unchanged, seq 2 (one
# sequence per object). The value of an event is never judged. Three
# refusals send nothing, each said by its name in the wire server's log: at
# 2.4 s of its own script c2 reports the same PlayAnimation
# (E_SCRIPTCALL_OWNER: c1 hosts the cell); at 3.6 s c1 reports
# Debug.Notification (E_SCRIPTCALL_ROW: no row in the table); at 3.8 s c1
# reports PlayAnimation with no argument (E_SCRIPTCALL_ARGS). The legacy
# server knows no MsgType 75 and drops all five. c2 never reports the cell
# loaded, so c1's departure leaves it unhosted after the grace with nothing to
# c2; c2 steps aside at 6 s so it outlives c1, as in every session.
id: script-call
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 1000, send: {t: 47, cell: 0xbbb1, loaded: true}, reliable: true}
  - {client: c1, at_ms: 3000, send: {t: 75, epoch: 1, selfId: 0x10e6c5, cls: ObjectReference, fn: PlayAnimation, args: [Open], caller: "", handler: "", latent: false}, reliable: true}
  - {client: c1, at_ms: 3200, send: {t: 75, epoch: 1, selfId: 0x10e6c5, cls: Debug, fn: SendAnimationEvent, args: [{formId: 0x10e6c5, type: ObjectReference}, Open], caller: "", handler: "", latent: false}, reliable: true}
  - {client: c2, at_ms: 2400, send: {t: 75, epoch: 1, selfId: 0x10e6c5, cls: ObjectReference, fn: PlayAnimation, args: [Open], caller: "", handler: "", latent: false}, reliable: true}
  - {client: c1, at_ms: 3600, send: {t: 75, epoch: 1, selfId: 0x10e6c5, cls: Debug, fn: Notification, args: [hi], caller: "", handler: "", latent: false}, reliable: true}
  - {client: c1, at_ms: 3800, send: {t: 75, epoch: 1, selfId: 0x10e6c5, cls: ObjectReference, fn: PlayAnimation, args: [], caller: "", handler: "", latent: false}, reliable: true}
  - {client: c2, at_ms: 6000, move: {dx: 1, dy: 0}}
divergences:
  - client: c1
    msg: {t: 48, cell: 0xbbb1, epoch: 1}
    legacy: 0
    wire: 1
    reason: the first loader in reach hosts the cell (HostGrant, thuum docs/verbs/cell-host.md); the legacy server has no cell hosts
  - client: c2
    msg: {t: 30, class: ObjectReference, function: PlayAnimation, selfId: 0x10e6c5, arguments: [Open], seq: 1}
    legacy: 0
    wire: 1
    reason: the cell host's script call relayed to the subject's other listener with the subject's sequence (ScriptCall, thuum ADR-068); the legacy server knows no MsgType 75
  - client: c2
    msg: {t: 30, class: Debug, function: SendAnimationEvent, selfId: 0, arguments: [{formId: 0x10e6c5, type: ObjectReference}, Open], seq: 2}
    legacy: 0
    wire: 1
    reason: the host's static call relayed with no self and its target first, the target's next sequence (ScriptCall, thuum ADR-068); the legacy server knows no MsgType 75
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
