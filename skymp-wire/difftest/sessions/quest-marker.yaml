# difftest quest-marker (thuum ADR-073 step 4's S6, Eli's D-NT4 A; D-PO1 B and D-G6 A; docs/verbs/map-markers.md): a quest
# script's AddToMap, the map-markers record's report from every seat that runs it. c1 and c2 are new characters
# (profiles 9 and 10, actors 0xff000002 and 0xff000003, see melee-reach), both at the spawn. At 2 s c1 reports stage 10 of
# FreeformRiverwood01 (0x74a83, a world quest T2 shares: quest-stage's report, relayed to c2 with c1 acting), so the
# server's journal holds the quest staged. At 3 s c1's game reports ObjectReference.AddToMap(true) on the clearing's map
# marker 0x16223 (a REFR of the MapMarker STAT 0x00000010, the marker nearest the spawn; lab/esm.py) from
# QF_FreeformRiverwood01_00074A83, the quest's own fragment script (its QUST's VMAD, Skyrim.esm by lab/esm.py,
# 2026-11-15; a script the game files attach to a QUST, so its cause is the quest's): the wire stack records the marker
# on the world's map-markers record (the journal's) and relays AddToMap(true) on 0x16223 to c2 at once, with no
# sequence, as the login serve would; c1, whose own game ran it, hears nothing. At 3.2 s the same report again folds:
# already recorded, nothing relayed. Three refusals send nothing, each said by its name in the wire server's log: at
# 3.4 s the same cause names the ore vein 0x10e6c5 (an ACTI, no map marker: E_SCRIPTCALL_ROW); at 3.6 s the marker
# from defaultPuzzlePillarScript (attached to no QUST, INFO or SCEN of the game files, no cause: E_SCRIPTCALL_OWNER); at
# 3.8 s Bleak Falls Barrow's marker 0x16232 (base 0x10) from QF_MS10MiscObjPointer_0010D3BB, a quest the journal holds no
# run or stage of and the game files never start (QUST 0x10d3bb, DNAM main flags 0x00: E_SCRIPTCALL_OWNER, its quest not
# live). The legacy server knows neither MsgType 57 nor 75 and drops them all. A login after 3 s would be served the
# world's marker beside the player's own (the ctest MapMarkersTest and x-azura-marker cover that and the restart). c2
# steps again at 5 s of its own, so it outlives c1, as in every session.
id: quest-marker
clients:
  c1: {profile_id: 9}
  c2: {profile_id: 10}
steps:
  - {client: c1, at_ms: 1000, move: {dx: 10}}
  - {client: c1, at_ms: 2000, send: {t: 57, quest: 0x74a83, stage: 10}, reliable: true}
  - {client: c1, at_ms: 3000, send: {t: 75, epoch: 0, selfId: 0x16223, cls: ObjectReference, fn: AddToMap, args: [true], caller: QF_FreeformRiverwood01_00074A83, handler: Fragment_0, latent: false}, reliable: true}
  - {client: c1, at_ms: 3200, send: {t: 75, epoch: 0, selfId: 0x16223, cls: ObjectReference, fn: AddToMap, args: [true], caller: QF_FreeformRiverwood01_00074A83, handler: Fragment_0, latent: false}, reliable: true}
  - {client: c1, at_ms: 3400, send: {t: 75, epoch: 0, selfId: 0x10e6c5, cls: ObjectReference, fn: AddToMap, args: [true], caller: QF_FreeformRiverwood01_00074A83, handler: Fragment_0, latent: false}, reliable: true}
  - {client: c1, at_ms: 3600, send: {t: 75, epoch: 0, selfId: 0x16223, cls: ObjectReference, fn: AddToMap, args: [true], caller: defaultPuzzlePillarScript, handler: onActivate, latent: false}, reliable: true}
  - {client: c1, at_ms: 3800, send: {t: 75, epoch: 0, selfId: 0x16232, cls: ObjectReference, fn: AddToMap, args: [true], caller: QF_MS10MiscObjPointer_0010D3BB, handler: Fragment_0, latent: false}, reliable: true}
  - {client: c2, at_ms: 0, move: {dx: 50}}
  - {client: c2, at_ms: 5000, move: {dx: 60}}
divergences:
  - client: c2
    msg: {t: 57, quest: 0x74a83, stage: 10, acting: 0xff000002}
    legacy: 0
    wire: 1
    reason: the world's stage relayed to the other seat with its acting player (QuestStage, thuum docs/verbs/quest-stage.md; ADR-068 rung 5); the legacy server knows no such message
  - client: c2
    msg: {t: 30, class: ObjectReference, function: AddToMap, selfId: 0x16223, arguments: [true]}
    legacy: 0
    wire: 1
    reason: a world quest's map marker recorded for every player the quest is shown to and relayed live to the other seat, once (ScriptCall's quest marker record, thuum ADR-073 step 4's S6, D-NT4 A); the legacy server knows no MsgType 75
  - client: c2
    msg: {t: 25, idx: "refr:ff000002"}
    legacy: 0
    wire: 1
    reason: departure detection, graceful close on the wire against RakNet's timeout
